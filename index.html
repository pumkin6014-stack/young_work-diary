<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDM · 업무 다이어리</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZriTNXekmMNKrnNQnnuVW2SfUEmA8-_4",
            authDomain: "work-diary-8e37b.firebaseapp.com",
            projectId: "work-diary-8e37b",
            storageBucket: "work-diary-8e37b.appspot.com",
            messagingSenderId: "678422675784",
            appId: "1:678422675784:web:3cdca5bbe4a57bccb2f37d",
            measurementId: "G-SK1J7DBPHY"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        auth.onAuthStateChanged((user) => {
            const loginBtn = document.getElementById('login-btn');
            if (user) {
                if(loginBtn) loginBtn.innerText = `${user.displayName.split(' ')[0]} (로그아웃)`;
                loadUserDataFromCloud(user.uid);
            } else {
                if(loginBtn) loginBtn.innerText = '구글 로그인';
            }
        });

        function handleGoogleLogin() {
            const user = auth.currentUser;
            if (user) {
                auth.signOut().then(() => {
                    alert('로그아웃 되었습니다.');
                    location.reload();
                });
            } else {
                auth.signInWithPopup(provider).then((result) => {
                    alert(`${result.user.displayName.split(' ')[0]}님 환영합니다!`);
                }).catch((error) => {
                    console.error("로그인 실패:", error);
                    alert("로그인에 실패했습니다: " + error.message);
                });
            }
        }

        function saveDataToStorage() {
            const sdmData = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            const sdmMinutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const sdmSummaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
            const sdmMonthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
            const user = auth.currentUser;
            if (user) {
                db.collection("users").doc(user.uid).set({
                    sdm_data: sdmData,
                    sdm_minutes: sdmMinutes,
                    sdm_summaries: sdmSummaries,
                    sdm_month_notes: sdmMonthNotes,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).catch(err => console.error("동기화 실패:", err));
            }
        }

        function loadUserDataFromCloud(uid) {
            db.collection("users").doc(uid).onSnapshot((docSnap) => {
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.sdm_data) localStorage.setItem('sdm_data', JSON.stringify(data.sdm_data));
                    if (data.sdm_minutes) localStorage.setItem('sdm_minutes', JSON.stringify(data.sdm_minutes));
                    if (data.sdm_summaries) localStorage.setItem('sdm_summaries', JSON.stringify(data.sdm_summaries));
                    if (data.sdm_month_notes) localStorage.setItem('sdm_month_notes', JSON.stringify(data.sdm_month_notes));
                } else {
                    const initialData = JSON.parse(localStorage.getItem('sdm_data') || '{}');
                    const initialMinutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
                    const initialSummaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
                    const initialMonthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
                    db.collection("users").doc(uid).set({ sdm_data: initialData, sdm_minutes: initialMinutes, sdm_summaries: initialSummaries, sdm_month_notes: initialMonthNotes }, { merge: true });
                }
                if (typeof renderView === 'function') renderView();
                if (typeof loadAllMonthValues === 'function') loadAllMonthValues();
            });
        }
    </script>

    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f7f6f3; }
        .notebook-zone {
            background-color: #ffffff;
            background-image: linear-gradient(to bottom, #f1f0eb 1px, transparent 1px);
            background-size: 100% 30px;
        }
        .notebook-textarea {
            font-size: 13px !important;
            line-height: 30px !important;
            padding-top: 0px !important;
            padding-bottom: 0px !important;
            background-image: none !important;
        }
        .todo-item { cursor: grab; }
        .todo-item:active { cursor: grabbing; }

        #summary-panel {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-stone-800 flex flex-col p-2 sm:p-4">

            <div id="summary-panel" class="absolute left-full top-0 h-full w-0 bg-stone-800 text-stone-200 border-r border-stone-700 shadow-2xl overflow-hidden flex flex-col z-50 pointer-events-none opacity-0">

                    <div class="space-y-3 flex-1 flex flex-col overflow-hidden">

                            <h3 id="summary-panel-main-title" class="text-xs font-bold text-stone-200 tracking-tight">2026년 월별 핵심요약</h3>

    <script>
        let currentView = 'monthly';
        let currentDate = new Date();
        let activeDateKey = null;
        let activeMinuteId = null;
        let searchQuery = '';
        
        let activeDateMenuKey = null;
        let copiedDateData = null;
        let activeTodoTarget = null;
        let activeTodoTextForCopy = '';
        
        let isSummaryOpen = false;

        window.onload = () => {
            renderView();
            loadAllMonthValues();
            window.addEventListener('click', (e) => {
                document.getElementById('date-context-menu').classList.add('hidden');
                document.getElementById('todo-context-menu').classList.add('hidden');
            });
        };

        function toggleSummaryPanel() {
            isSummaryOpen = !isSummaryOpen;
            const panel = document.getElementById('summary-panel');

            if (isSummaryOpen) {
                panel.style.width = '300px';
                panel.style.opacity = '1';
                panel.classList.remove('pointer-events-none');
                loadAllMonthValues();
            } else {
                panel.style.width = '0px';
                panel.style.opacity = '0';
                panel.classList.add('pointer-events-none');
            }
        }

        function loadAllMonthValues() {
            const year = currentDate.getFullYear();
            const summaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
            const summaryTitle = document.getElementById('summary-panel-main-title');
            if (summaryTitle) summaryTitle.innerText = `${year}년 월별 핵심요약`;
            
            for (let m = 1; m <= 12; m++) {
                const summaryKey = `${year}-${String(m).padStart(2, '0')}`;
                const container = document.getElementById(`summary-items-${m}`);
                if (!container) continue;

                let items = summaries[summaryKey];
                if (!Array.isArray(items)) items = [];

                container.innerHTML = '';
                if (items.length > 0) {
                    items.forEach((item) => {
                        renderSummaryItemHTML(m, item.id, item.text, item.done);
                    });
                }
            }
        }

        function renderSummaryItemHTML(monthNum, itemId, textValue, isDone) {
            const container = document.getElementById(`summary-items-${monthNum}`);
            if (!container) return;

            const div = document.createElement('div');
            div.className = "flex items-center gap-1.5 group bg-stone-900/30 px-2 py-1 rounded-lg border border-stone-800";
            div.id = `summary-item-row-${monthNum}-${itemId}`;
            div.innerHTML = `
                <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleSummaryCheckbox(${monthNum}, ${itemId})" class="w-3.5 h-3.5 accent-stone-500 rounded cursor-pointer shrink-0">
                <input type="text" id="sum-text-${monthNum}-${itemId}" value="${textValue || ''}" disabled class="w-full bg-transparent border-0 p-0 text-xs text-stone-100 focus:outline-none placeholder:text-stone-500 ${isDone ? 'line-through opacity-50' : ''}">
                <button type="button" id="sum-btn-${monthNum}-${itemId}" onclick="toggleEditSummary(${monthNum}, ${itemId})" class="text-[10px] text-stone-300 bg-stone-700 hover:bg-stone-600 px-1.5 py-0.5 rounded shrink-0 font-medium">수정</button>
                <button type="button" onclick="removeSummaryItem(${monthNum}, ${itemId})" class="text-[10px] text-stone-500 hover:text-rose-400 px-1">✕</button>
            `;
            container.appendChild(div);
        }

        function toggleEditSummary(monthNum, itemId) {
            const input = document.getElementById(`sum-text-${monthNum}-${itemId}`);
            const btn = document.getElementById(`sum-btn-${monthNum}-${itemId}`);
            if (!input || !btn) return;

            if (input.disabled) {
                input.disabled = false;
                input.focus();
                btn.innerText = '저장';
                btn.className = 'text-[10px] text-white bg-amber-600 hover:bg-amber-500 px-1.5 py-0.5 rounded shrink-0 font-medium';
            } else {
                input.disabled = true;
                btn.innerText = '수정';
                btn.className = 'text-[10px] text-stone-300 bg-stone-700 hover:bg-stone-600 px-1.5 py-0.5 rounded shrink-0 font-medium';
                saveSummaryTexts(monthNum);
            }
        }

        function toggleSummaryCheckbox(monthNum, itemId) {
            saveSummaryTexts(monthNum);
            loadAllMonthValues();
        }

        function saveSummaryTexts(monthNum) {
            const year = currentDate.getFullYear();
            const summaryKey = `${year}-${String(monthNum).padStart(2, '0')}`;
            const summaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
            const container = document.getElementById(`summary-items-${monthNum}`);
            if (!container) return;

            const rows = container.querySelectorAll('.group');
            let newItems = [];
            rows.forEach(row => {
                const checkbox = row.querySelector('input[type="checkbox"]');
                const textInput = row.querySelector('input[type="text"]');
                if (textInput) {
                    const parts = textInput.id.split('-');
                    const existingId = parts[parts.length - 1];
                    newItems.push({
                        id: Number(existingId),
                        text: textInput.value,
                        done: checkbox.checked
                    });
                }
            });
            summaries[summaryKey] = newItems;
            localStorage.setItem('sdm_summaries', JSON.stringify(summaries));

        }

        function handleSummaryKeyDown(e, monthNum) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSummaryItem(monthNum);

        function addSummaryItem(monthNum) {
            const inputField = document.getElementById(`summary-input-${monthNum}`);
            if (!inputField) return;
            const text = inputField.value.trim();
            if (!text) return;

            const year = currentDate.getFullYear();
            const summaryKey = `${year}-${String(monthNum).padStart(2, '0')}`;
            const summaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');

            if (!Array.isArray(items)) items = [];

            localStorage.setItem('sdm_summaries', JSON.stringify(summaries));
            saveDataToStorage();

            inputField.value = '';
            loadAllMonthValues();

        function removeSummaryItem(monthNum, itemId) {
            const year = currentDate.getFullYear();
            const summaryKey = `${year}-${String(monthNum).padStart(2, '0')}`;
            const summaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
            
            let items = summaries[summaryKey];
            if (Array.isArray(items)) {
                summaries[summaryKey] = items.filter(i => i.id !== itemId);
                localStorage.setItem('sdm_summaries', JSON.stringify(summaries));
                saveDataToStorage();
                loadAllMonthValues();
            }
        }

        function loadMonthNotes() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const noteKey = `${year}-${String(month).padStart(2, '0')}`;
            const monthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
            const container = document.getElementById('monthly-notes-container');
            if (!container) return;

            let items = monthNotes[noteKey];
            if (!Array.isArray(items)) items = [];

            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = `<div class="text-[11px] text-stone-400 italic pl-1">등록된 핵심 메모가 없습니다. 아래에서 추가해주세요.</div>`;
            } else {
                items.forEach((item, index) => {
                    renderMonthNoteItemHTML(noteKey, item.id, item.text, item.done, index, items.length);
                });
            }
        }

        function renderMonthNoteItemHTML(noteKey, itemId, textValue, isDone, index, totalLength) {
            const container = document.getElementById('monthly-notes-container');
            if (!container) return;

            const div = document.createElement('div');
            div.className = "flex items-center gap-1.5 group bg-white px-2 py-1.5 rounded-lg border border-stone-200 shadow-2xs";
            div.id = `month-note-row-${itemId}`;
            div.innerHTML = `
                <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleMonthNoteCheckbox('${noteKey}')" class="w-3.5 h-3.5 accent-stone-600 rounded cursor-pointer shrink-0">
                <input type="text" id="mn-text-${itemId}" value="${textValue || ''}" disabled class="w-full bg-transparent border-0 p-0 text-xs text-stone-700 focus:outline-none placeholder:text-stone-400 ${isDone ? 'line-through opacity-50' : ''}">
                <button type="button" id="mn-btn-${itemId}" onclick="toggleEditMonthNote('${itemId}')" class="text-[10px] text-stone-600 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-1.5 py-0.5 rounded shrink-0 font-medium">수정</button>
                <div class="flex items-center gap-0.5 ml-1 shrink-0">
                    <div class="flex flex-col">

                        <button type="button" onclick="moveMonthNoteDown('${itemId}')" class="text-[8px] text-stone-400 hover:text-stone-700 leading-none px-0.5" title="아래로">▼</button>
                    </div>
                    <button type="button" onclick="removeMonthNoteItem('${itemId}')" class="text-[10px] text-stone-400 hover:text-rose-500 px-1 font-bold ml-0.5" title="삭제">×</button>
                </div>

        function toggleEditMonthNote(itemId) {
            const input = document.getElementById(`mn-text-${itemId}`);
            const btn = document.getElementById(`mn-btn-${itemId}`);
            if (!input || !btn) return;

            if (input.disabled) {
                input.disabled = false;
                input.focus();
                btn.innerText = '저장';
                btn.className = 'text-[10px] text-white bg-stone-700 hover:bg-stone-800 px-1.5 py-0.5 rounded shrink-0 font-medium';
            } else {
                input.disabled = true;
                btn.innerText = '수정';
                btn.className = 'text-[10px] text-stone-600 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-1.5 py-0.5 rounded shrink-0 font-medium';
                saveMonthNotesStorage();
            }
        }

        function toggleMonthNoteCheckbox(noteKey) {
            saveMonthNotesStorage();
            loadMonthNotes();
        }

        function saveMonthNotesStorage() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const noteKey = `${year}-${String(month).padStart(2, '0')}`;
            const monthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
            const container = document.getElementById('monthly-notes-container');
            if (!container) return;

            const rows = container.querySelectorAll('.group');
            let newItems = [];
            rows.forEach(row => {
                const checkbox = row.querySelector('input[type="checkbox"]');
                const textInput = row.querySelector('input[type="text"]');
                if (textInput) {
                    const parts = textInput.id.split('-');
                    const existingId = parts[parts.length - 1];
                    newItems.push({
                        id: Number(existingId),
                        text: textInput.value,
                        done: checkbox.checked
                    });
                }
            });
            monthNotes[noteKey] = newItems;
            localStorage.setItem('sdm_month_notes', JSON.stringify(monthNotes));
            saveDataToStorage();
        }

        function handleMonthNoteKeyDown(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addMonthNoteItem();
            }
        }

        function addMonthNoteItem() {
            const inputField = document.getElementById('monthly-note-input');
            if (!inputField) return;
            const text = inputField.value.trim();
            if (!text) return;

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const noteKey = `${year}-${String(month).padStart(2, '0')}`;
            const monthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
            
            let items = monthNotes[noteKey];
            if (!Array.isArray(items)) items = [];

            items.push({ id: Date.now(), text: text, done: false });
            monthNotes[noteKey] = items;

            localStorage.setItem('sdm_month_notes', JSON.stringify(monthNotes));
            saveDataToStorage();

            inputField.value = '';
            loadMonthNotes();
        }

        function removeMonthNoteItem(itemId) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const noteKey = `${year}-${String(month).padStart(2, '0')}`;
            const monthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
            
            let items = monthNotes[noteKey];
            if (Array.isArray(items)) {
                monthNotes[noteKey] = items.filter(i => String(i.id) !== String(itemId));
                localStorage.setItem('sdm_month_notes', JSON.stringify(monthNotes));
                saveDataToStorage();
                loadMonthNotes();
            }
        }

        function moveMonthNoteUp(itemId) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const noteKey = `${year}-${String(month).padStart(2, '0')}`;
            const monthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
            let items = monthNotes[noteKey];
            if (!Array.isArray(items)) return;

            const idx = items.findIndex(i => String(i.id) === String(itemId));
            if (idx <= 0) return;

            const temp = items[idx];
            items[idx] = items[idx - 1];
            items[idx - 1] = temp;

            monthNotes[noteKey] = items;
            localStorage.setItem('sdm_month_notes', JSON.stringify(monthNotes));
            saveDataToStorage();
            loadMonthNotes();
        }

        function moveMonthNoteDown(itemId) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const noteKey = `${year}-${String(month).padStart(2, '0')}`;
            const monthNotes = JSON.parse(localStorage.getItem('sdm_month_notes') || '{}');
            let items = monthNotes[noteKey];
            if (!Array.isArray(items)) return;

            const idx = items.findIndex(i => String(i.id) === String(itemId));
            if (idx === -1 || idx >= items.length - 1) return;

            const temp = items[idx];
            items[idx] = items[idx + 1];
            items[idx + 1] = temp;

            monthNotes[noteKey] = items;
            localStorage.setItem('sdm_month_notes', JSON.stringify(monthNotes));
            saveDataToStorage();
            loadMonthNotes();
        }

        function switchView(view) {
            currentView = view;
            if (view === 'daily') currentDate = new Date();

            ['monthly', 'weekly', 'daily', 'minutes'].forEach(v => {
                const btn = document.getElementById(`tab-${v}`);
                if(btn) {
                    btn.className = (v === view) 
                        ? "w-full py-2.5 rounded-xl flex flex-col items-center justify-center bg-stone-500 text-white shadow-xs transition-all"
                        : "w-full py-2.5 rounded-xl flex flex-col items-center justify-center text-stone-300 hover:bg-stone-600 transition-all";
                }
            });
            const titles = { monthly: '월간 다이어리', weekly: '주간 다이어리', daily: '일간 다이어리', minutes: '회의록' };
            document.getElementById('view-title').innerText = titles[view];
            document.title = titles[view] + ' · SDM';
            
            const nav = document.getElementById('date-navigator');
            nav.style.display = (view === 'minutes') ? 'none' : 'flex';

            renderView();
        }

        function renderView() {
            if (currentView === 'monthly') renderMonthly();
            else if (currentView === 'weekly') renderWeekly();
            else if (currentView === 'daily') renderDaily();
            else if (currentView === 'minutes') renderMinutes();
            
            loadTodos();
            loadAllMonthValues();
            loadMonthNotes();
            updateWorkSummaryBadge();
        }

        function updateWorkSummaryBadge() {
            const badge = document.getElementById('work-summary-badge');
            if (!badge) return;

            if (currentView !== 'monthly' && currentView !== 'weekly' && currentView !== 'daily') {
                badge.classList.add('hidden');
                return;
            }

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');

            let totalOvertime = 0;
            let dutyDays = [];
            let fdDays = [];

            for (let d = 1; d <= 31; d++) {
                const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                if (data[dateKey] && data[dateKey].tags) {
                    data[dateKey].tags.forEach(tag => {
                        if (tag === '시간외1') totalOvertime += 1;
                        else if (tag === '시간외1.5') totalOvertime += 1.5;
                        else if (tag === '시간외2') totalOvertime += 2;
                        else if (tag === '당직') dutyDays.push(d);
                        else if (tag === 'FD') fdDays.push(d);
                    });
                }
            }

            let summaryTextParts = [];
            if (totalOvertime > 0) summaryTextParts.push(`시간외 총 ${totalOvertime}시간`);
            if (dutyDays.length > 0) summaryTextParts.push(`당직: ${dutyDays.join(', ')}일`);
            if (fdDays.length > 0) summaryTextParts.push(`FD: ${fdDays.join(', ')}일`);

            if (summaryTextParts.length > 0) {
                badge.innerText = summaryTextParts.join(' | ');
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function createMonthlyCellHTML(year, month, day, dateKey, isCurrentMonth = true) {
            const today = new Date();
            const isToday = isCurrentMonth && 
                            year === today.getFullYear() && 
                            month === today.getMonth() && 
                            day === today.getDate();

            let cellStyle = isCurrentMonth ? 'bg-white' : 'bg-white/60 opacity-60';
            let borderStyle = 'border border-stone-200';
            
            if (isToday) {
                cellStyle = 'bg-stone-50/90 shadow-xs ring-1 ring-stone-400';
                borderStyle = 'border-2 border-stone-500';
            }

            return `
                <div class="${cellStyle} min-h-[180px] p-2.5 flex flex-col justify-between relative ${borderStyle}" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center gap-1.5">
                                <span onclick="goToDaily(${year}, ${month}, ${day})" class="text-xs font-bold ${isToday ? 'bg-stone-700 text-white px-1.5 py-0.5 rounded-md shadow-2xs' : 'text-stone-700 hover:text-stone-900'} cursor-pointer shrink-0">${day}</span>
                                ${isToday ? '<span class="text-[9px] font-extrabold px-1.5 py-0.2 bg-stone-200 text-stone-700 rounded tracking-wider">TODAY</span>' : ''}
                            </div>
                            <div class="flex flex-wrap gap-1 items-center justify-end overflow-hidden max-h-[45px]" id="tags-box-${dateKey}"></div>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-1 mb-1 max-h-[90px] todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                    <div class="space-y-1 z-30">
                        <div class="flex gap-1">
                            <input type="text" id="input-${dateKey}" onkeydown="handleKeyDown(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-[11px] px-2.5 py-1.5 bg-stone-50 border border-stone-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700">
                            <button type="button" onclick="addTodoItem('${dateKey}')" class="bg-stone-600 text-white px-3 py-1 rounded-lg text-[11px] font-bold shrink-0 hover:bg-stone-700 transition-all">+</button>
                        </div>
                        <div class="flex items-center justify-between gap-1 pt-0.5">
                            <button type="button" onclick="openChefModal('${dateKey}')" class="text-[10px] px-2 py-0.5 rounded-md bg-stone-100 text-stone-700 hover:bg-stone-200 font-semibold border border-stone-200 transition-all">+ 휴가</button>
                            <button type="button" onclick="openTagModal('${dateKey}')" class="text-[10px] px-2 py-0.5 rounded-md bg-stone-100 text-stone-700 hover:bg-stone-200 font-semibold border border-stone-200 transition-all">+ 근무</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const titleEl = document.getElementById('current-date-title');
            if (titleEl) titleEl.innerText = `${year}년 ${month + 1}월`;

            const firstDayObj = new Date(year, month, 1);
            let firstDayIndex = (firstDayObj.getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            
            let html = `
                <div class="w-full bg-white border-0 flex flex-col">
                    <div class="p-4 bg-stone-50/90 border-b border-stone-200 shrink-0 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-stone-700 tracking-wide">📌 ${month + 1}월 핵심 메모 & 중요 일정</span>
                        </div>
                        <div id="monthly-notes-container" class="space-y-1.5"></div>
                        <div class="flex gap-1.5 pt-1">
                            <input type="text" id="monthly-note-input" onkeydown="handleMonthNoteKeyDown(event)" placeholder="중요 메모 입력 후 엔터 또는 + 버튼..." class="w-full text-xs px-3 py-2 bg-white border border-stone-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700 placeholder:text-stone-400">
                            <button type="button" onclick="addMonthNoteItem()" class="bg-stone-600 text-white px-4 py-2 rounded-xl text-xs font-bold shrink-0 hover:bg-stone-700 transition-all">+</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-7 text-center text-xs font-bold text-stone-400 bg-stone-50 py-3 border-b border-stone-200">
                        <div>월요일</div><div>화요일</div><div>수요일</div><div>목요일</div><div>금요일</div><div class="text-stone-500">토요일</div><div class="text-rose-500">일요일</div>
                    </div>
                    <div class="grid grid-cols-7 gap-[1px] bg-stone-200">
            `;

            const prevMonth = month === 0 ? 11 : month - 1;
            const prevYear = month === 0 ? year - 1 : year;
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const day = prevTotalDays - i;
                html += createMonthlyCellHTML(prevYear, prevMonth, day, `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, false);
            }

            for (let day = 1; day <= totalDays; day++) {
                html += createMonthlyCellHTML(year, month, day, `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, true);
            }

            const remaining = (7 - ((firstDayIndex + totalDays) % 7)) % 7;
            const nextMonth = month === 11 ? 0 : month + 1;
            const nextYear = month === 11 ? year + 1 : year;
            for (let day = 1; day <= remaining; day++) {
                html += createMonthlyCellHTML(nextYear, nextMonth, day, `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, false);
            }

            html += `</div></div>`;
            const container = document.getElementById('view-container');
            if(container) container.innerHTML = html;
            loadMonthNotes();
        }

        function goToDaily(year, month, day) {
            currentDate = new Date(year, month, day);
            switchView('daily');
        }

        function createWeeklyCellHTML(dayTitle, dateKey, year, month, day) {
            return `

                                    <button type="button" onclick="addTodoItem('${dateKey}')" class="bg-stone-600 text-white px-3 py-2 rounded-lg text-xs font-bold shrink-0 hover:bg-stone-700 transition-all">+</button>

                    </div>
                </div>
            `;
        }

        function renderWeekly() {
            const curr = new Date(currentDate);
            const distanceToMon = (curr.getDay() === 0 ? -6 : 1 - curr.getDay());
            const firstday = new Date(curr);
            firstday.setDate(curr.getDate() + distanceToMon);
            const lastday = new Date(firstday);
            lastday.setDate(firstday.getDate() + 6);
            
            const titleEl = document.getElementById('current-date-title');
            if (titleEl) titleEl.innerText = `${firstday.getMonth()+1}월 ${firstday.getDate()}일 ~ ${lastday.getMonth()+1}월 ${lastday.getDate()}일`;

            const daysName = ['월요일', '화요일', '수요일', '목요일', '금요일', '<span class="text-stone-500">토요일</span>', '<span class="text-rose-500">일요일</span>'];
            let topRowHTML = '', bottomRowHTML = '';

            for (let i = 0; i < 7; i++) {
                const d = new Date(firstday);
                d.setDate(firstday.getDate() + i);
                const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                const cell = createWeeklyCellHTML(`${daysName[i]} ${d.getDate()}`, dateKey, d.getFullYear(), d.getMonth(), d.getDate());
                if (i < 4) topRowHTML += cell;
                else bottomRowHTML += cell;
            }

            const container = document.getElementById('view-container');
            if(container) container.innerHTML = `
                <div class="w-full bg-white border-t border-l border-stone-200">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">${topRowHTML}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">${bottomRowHTML}<div class="min-h-[480px] border-r border-b border-stone-200 bg-white/50"></div></div>
                </div>
            `;
        }

        function renderDaily() {
            const year = currentDate.getFullYear(), month = currentDate.getMonth() + 1, day = currentDate.getDate();
            const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayName = ['일', '월', '화', '수', '목', '금', '토'][currentDate.getDay()];

            const titleEl = document.getElementById('current-date-title');
            if (titleEl) titleEl.innerText = `${year}년 ${month}월 ${day}일 (${dayName})`;

            const container = document.getElementById('view-container');
            if(container) container.innerHTML = `
                <div class="w-full p-8 space-y-6 bg-white min-h-[600px] flex flex-col" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div class="border-b border-stone-200 pb-4 flex justify-between items-center shrink-0">
                        <div class="flex items-center gap-4">
                            <h2 class="text-xl font-bold text-stone-800">${month}월 ${day}일 ${dayName}요일</h2>
                            <div class="flex flex-wrap gap-1.5" id="tags-box-${dateKey}"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="openChefModal('${dateKey}')" class="px-3.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 font-bold text-xs border border-stone-200 hover:bg-stone-200 transition-all">+ 휴가 추가</button>
                            <button type="button" onclick="openTagModal('${dateKey}')" class="px-3.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 font-bold text-xs border border-stone-200 hover:bg-stone-200 transition-all">+ 근무 태그 추가</button>
                        </div>
                    </div>
                    <div class="space-y-3 shrink-0">
                        <div class="bg-stone-50/70 border border-stone-200 p-4 rounded-xl space-y-2">
                            <div class="space-y-2 mb-3 max-h-[160px] overflow-y-auto todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                            <div class="flex gap-2">
                                <input type="text" id="input-${dateKey}" onkeydown="handleKeyDown(event, '${dateKey}')" placeholder="할 일을 입력하세요" class="w-full text-sm px-4 py-2.5 bg-white border border-stone-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700">
                                <button type="button" onclick="addTodoItem('${dateKey}')" class="bg-stone-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold shrink-0 hover:bg-stone-700 transition-all">추가</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col space-y-2 pt-2">
                        <div class="flex justify-between items-center shrink-0">
                            <div class="text-xs font-bold text-stone-500">일일 메모</div>
                            <button type="button" id="memo-btn-${dateKey}" onclick="toggleEditMemo('${dateKey}')" class="text-xs px-3 py-1 bg-stone-100 text-stone-700 border border-stone-200 rounded-lg font-bold hover:bg-stone-200 transition-all">수정</button>
                        </div>
                        <div class="flex-1 notebook-zone p-0">
                            <textarea id="memo-${dateKey}" disabled class="w-full h-full min-h-[180px] text-sm p-0 bg-transparent border-0 rounded-none focus:outline-none resize-none notebook-textarea"></textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleEditMemo(dateKey) {
            const memoField = document.getElementById(`memo-${dateKey}`);
            const btn = document.getElementById(`memo-btn-${dateKey}`);
            if (!memoField || !btn) return;

            if (memoField.disabled) {
                memoField.disabled = false;
                memoField.focus();
                btn.innerText = '저장';
                btn.className = 'text-xs px-3 py-1 bg-stone-700 text-white border border-stone-700 rounded-lg font-bold hover:bg-stone-800 transition-all';
            } else {
                memoField.disabled = true;
                btn.innerText = '수정';
                btn.className = 'text-xs px-3 py-1 bg-stone-100 text-stone-700 border border-stone-200 rounded-lg font-bold hover:bg-stone-200 transition-all';
                saveMemo(dateKey);
            }
        }

        function renderMinutes() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            if (minutes.length > 0 && !activeMinuteId) activeMinuteId = minutes[0].id;

            const container = document.getElementById('view-container');
            if(container) container.innerHTML = `
                <div class="w-full bg-white grid grid-cols-1 md:grid-cols-12 min-h-[600px]">
                    <div class="md:col-span-4 border-r border-stone-200 p-5 bg-stone-50/50 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xs font-bold text-stone-600 uppercase tracking-wide">회의록 목록</h3>
                                <button type="button" onclick="createMinute()" class="bg-stone-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-stone-700 transition-all">+ 회의 기록</button>
                            </div>
                            <div class="space-y-2 overflow-y-auto max-h-[500px]">
                                ${minutes.length === 0 ? '<p class="text-xs text-stone-400 py-6 text-center">저장된 회의록이 없습니다.</p>' : ''}
                                ${minutes.map(m => `
                                    <div onclick="selectMinute(${m.id})" class="p-3.5 rounded-xl border cursor-pointer transition-all ${activeMinuteId === m.id ? 'bg-stone-100 border-stone-300 shadow-2xs' : 'bg-white border-stone-200 hover:bg-stone-50'}">
                                        <div class="text-xs font-bold text-stone-800 truncate">${m.title || '제목 없음'}</div>
                                        <div class="text-[10px] text-stone-400 mt-1">${m.date || ''} · 참석자: ${m.attendees || '미지정'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="md:col-span-8 p-8 bg-white flex flex-col justify-between">
                        ${renderMinuteEditor(minutes.find(m => m.id === activeMinuteId))}
                    </div>
                </div>
            `;
        }

        let isMinuteEditing = false;
        function renderMinuteEditor(minute) {
            if (!minute) return `<div class="flex items-center justify-center h-full text-stone-400 text-xs">좌측에서 회의록을 선택하거나 새로 만들어주세요.</div>`;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b border-stone-200 pb-3">
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-stone-800 text-sm">회의록 상세 작성</h3>
                            <button type="button" onclick="toggleEditMinute()" id="minute-edit-btn" class="text-xs px-3 py-1 bg-stone-100 text-stone-700 border border-stone-200 rounded-lg font-bold hover:bg-stone-200 transition-all">${isMinuteEditing ? '저장' : '수정'}</button>
                        </div>
                        <button type="button" onclick="deleteMinute(${minute.id})" class="text-xs text-rose-500 hover:bg-rose-50 px-2.5 py-1 rounded font-semibold transition-all">삭제</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" id="m-title" value="${minute.title || ''}" ${!isMinuteEditing ? 'disabled' : ''} placeholder="회의 제목" class="text-xs px-3.5 py-2.5 border border-stone-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700">
                        <input type="date" id="m-date" value="${minute.date || ''}" ${!isMinuteEditing ? 'disabled' : ''} class="text-xs px-3.5 py-2.5 border border-stone-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700">
                    </div>
                    <input type="text" id="m-attendees" value="${minute.attendees || ''}" ${!isMinuteEditing ? 'disabled' : ''} placeholder="참석자 이름" class="w-full text-xs px-3.5 py-2.5 border border-stone-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700">
                    <textarea id="m-content" ${!isMinuteEditing ? 'disabled' : ''} placeholder="회의 내용..." class="w-full h-32 text-xs p-3.5 border border-stone-200 rounded-xl resize-none focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700">${minute.content || ''}</textarea>
                    <textarea id="m-actions" ${!isMinuteEditing ? 'disabled' : ''} placeholder="실행 과제..." class="w-full h-24 text-xs p-3.5 border border-stone-200 rounded-xl resize-none focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-700">${minute.actions || ''}</textarea>
                </div>
            `;
        }

        function toggleEditMinute() {
            isMinuteEditing = !isMinuteEditing;
            if (!isMinuteEditing) {
                updateMinute(activeMinuteId);
            }
            renderMinutes();
        }

        function createMinute() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const newM = { id: Date.now(), title: '새로운 회의록', date: new Date().toISOString().split('T')[0], attendees: '', content: '', actions: '' };
            minutes.unshift(newM);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = newM.id;
            isMinuteEditing = true;
            saveDataToStorage();
            renderMinutes();
        }

        function selectMinute(id) { activeMinuteId = id; isMinuteEditing = false; renderMinutes(); }
        
        function updateMinute(id) {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const target = minutes.find(m => m.id === id);
            if (!target) return;
            const tEl = document.getElementById('m-title');
            const dEl = document.getElementById('m-date');
            const aEl = document.getElementById('m-attendees');
            const cEl = document.getElementById('m-content');
            const actEl = document.getElementById('m-actions');
            if(tEl) target.title = tEl.value;
            if(dEl) target.date = dEl.value;
            if(aEl) target.attendees = aEl.value;
            if(cEl) target.content = cEl.value;
            if(actEl) target.actions = actEl.value;
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            saveDataToStorage();
        }

        function deleteMinute(id) {
            if(!confirm('삭제하시겠습니까?')) return;
            let minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            minutes = minutes.filter(m => m.id !== id);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = minutes.length > 0 ? minutes[0].id : null;
            isMinuteEditing = false;
            saveDataToStorage();
            renderMinutes();
        }

        function changeDate(dir) {
            if (currentView === 'monthly') currentDate.setMonth(currentDate.getMonth() + dir);
            else if (currentView === 'weekly') currentDate.setDate(currentDate.getDate() + (dir * 7));
            else currentDate.setDate(currentDate.getDate() + dir);
            renderView();
        }
        
        function handleKeyDown(e, dateKey) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTodoItem(dateKey);
            }
        }
        
        function handleSearch(q) { searchQuery = q.trim().toLowerCase(); loadTodos(); }
        
        function openTagModal(dateKey) { activeDateKey = dateKey; document.getElementById('tag-modal').classList.remove('hidden'); }
        function closeTagModal() { document.getElementById('tag-modal').classList.add('hidden'); activeDateKey = null; }
        function selectTag(tagName) {
            if (!activeDateKey) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[activeDateKey]) data[activeDateKey] = { todos: [], tags: [], memo: '' };
            if(!data[activeDateKey].tags) data[activeDateKey].tags = [];
            data[activeDateKey].tags.push(tagName);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            closeTagModal();
            renderView();
        }

        function openChefModal(dateKey) { activeDateKey = dateKey; document.getElementById('chef-vacation-modal').classList.remove('hidden'); }
        function closeChefModal() { document.getElementById('chef-vacation-modal').classList.add('hidden'); activeDateKey = null; }
        function selectChefTag(name) { selectTag(`휴가: ${name}`); closeChefModal(); }

        function removeTag(dateKey, index) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey]?.tags) {
                data[dateKey].tags.splice(index, 1);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                renderView();
            }
        }

        function addTodoItem(dateKey) {
            const inputField = document.getElementById(`input-${dateKey}`);
            if (!inputField || !inputField.value.trim()) return;
            
            const text = inputField.value.trim();

            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            if(!data[dateKey].todos) data[dateKey].todos = [];
            data[dateKey].todos.push({ id: Date.now(), text, type: 'default', done: false });
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            
            inputField.value = '';
            updateTodoBoxOnly(dateKey);
        }

        function moveTodoUp(dateKey, index) {
            if (index <= 0) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                const temp = data[dateKey].todos[index];
                data[dateKey].todos[index] = data[dateKey].todos[index - 1];
                data[dateKey].todos[index - 1] = temp;
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function moveTodoDown(dateKey, index) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                if (index >= data[dateKey].todos.length - 1) return;
                const temp = data[dateKey].todos[index];
                data[dateKey].todos[index] = data[dateKey].todos[index + 1];
                data[dateKey].todos[index + 1] = temp;
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function toggleEditTodo(dateKey, id) {
            const input = document.getElementById(`todo-text-${dateKey}-${id}`);
            const btn = document.getElementById(`todo-edit-btn-${dateKey}-${id}`);
            if (!input || !btn) return;

            if (input.disabled) {
                input.disabled = false;
                input.focus();
                btn.innerText = '저장';
                btn.className = 'text-[10px] text-white bg-stone-700 hover:bg-stone-800 px-1 py-0.5 rounded font-medium shrink-0';
            } else {
                input.disabled = true;
                btn.innerText = '수정';
                btn.className = 'text-[10px] text-stone-600 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-1 py-0.5 rounded font-medium shrink-0';
                saveTodoItemTextDirect(dateKey, id);
            }
        }

        function saveTodoItemTextDirect(dateKey, id) {
            const textInput = document.getElementById(`todo-text-${dateKey}-${id}`);
            if (!textInput) return;
            
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.map(i => i.id === Number(id) ? {...i, text: textInput.value} : i);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
            }
        }

        function updateTodoBoxOnly(dateKey) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            const box = document.getElementById(`todo-box-${dateKey}`);
            if (box && data[dateKey]) {
                box.innerHTML = '';
                (data[dateKey].todos || []).forEach((item, index) => {
                    let bgClass = 'bg-white text-stone-700 border-stone-100';
                    if (item.type === 'meeting') bgClass = 'bg-rose-100 text-rose-900 border-rose-200 font-semibold';
                    else if (item.type === 'share') bgClass = 'bg-amber-100 text-amber-900 border-amber-200 font-semibold';
                    else if (item.type === 'notice') bgClass = 'bg-emerald-100 text-emerald-900 border-emerald-200 font-semibold';

                    const itemDiv = document.createElement('div');
                    itemDiv.className = `flex items-center justify-between text-[11px] px-2 py-1 rounded border ${bgClass} todo-item`;
                    itemDiv.draggable = true;
                    itemDiv.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', JSON.stringify({ dateKey, id: item.id })));
                    
                    itemDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        document.getElementById('date-context-menu').classList.add('hidden');
                        
                        activeTodoTarget = { dateKey, id: item.id };
                        activeTodoTextForCopy = item.text;
                        
                        const menu = document.getElementById('todo-context-menu');
                        menu.style.top = `${e.clientY}px`;
                        menu.style.left = `${e.clientX}px`;
                        menu.classList.remove('hidden');
                    });

                    itemDiv.innerHTML = `
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTodo('${dateKey}', ${item.id})" class="w-3.5 h-3.5 accent-stone-600 rounded cursor-pointer shrink-0 mr-1.5">
                        <input type="text" id="todo-text-${dateKey}-${item.id}" value="${item.text}" disabled class="w-full bg-transparent border-0 p-0 text-[11px] focus:outline-none ${item.done ? 'line-through opacity-40' : ''}">
                        <div class="flex items-center gap-1 ml-1 shrink-0">
                            <button type="button" id="todo-edit-btn-${dateKey}-${item.id}" onclick="toggleEditTodo('${dateKey}', ${item.id})" class="text-[10px] text-stone-600 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-1 py-0.5 rounded font-medium shrink-0">수정</button>
                            <div class="flex flex-col">
                                <button type="button" onclick="moveTodoUp('${dateKey}', ${index})" class="text-[8px] text-stone-400 hover:text-stone-700 leading-none px-0.5" title="위로">▲</button>
                                <button type="button" onclick="moveTodoDown('${dateKey}', ${index})" class="text-[8px] text-stone-400 hover:text-stone-700 leading-none px-0.5" title="아래로">▼</button>
                            </div>
                            <button type="button" onclick="deleteTodoItem('${dateKey}', ${item.id})" class="text-[10px] text-stone-400 hover:text-rose-500 px-1 font-bold ml-0.5" title="삭제">×</button>
                        </div>
                    `;
                    box.appendChild(itemDiv);
                });
            }
        }

        function saveMemo(dateKey) {
            const memoField = document.getElementById(`memo-${dateKey}`);
            if (!memoField) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            data[dateKey].memo = memoField.value;
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
        }

        function loadTodos() {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            for (const dateKey in data) {
                updateTodoBoxOnly(dateKey);
                
                const memoField = document.getElementById(`memo-${dateKey}`);
                if (memoField && memoField.disabled) memoField.value = data[dateKey].memo || '';
                
                const tagsBox = document.getElementById(`tags-box-${dateKey}`);
                if (tagsBox) {
                    tagsBox.innerHTML = '';
                    (data[dateKey].tags || []).forEach((tag, idx) => {
                        let tagStyle = 'bg-stone-100 text-stone-700';
                        if (tag === 'FD') tagStyle = 'bg-amber-100 text-amber-800';
                        else if (tag === '당직') tagStyle = 'bg-yellow-100 text-yellow-800';
                        else if (tag.startsWith('시간외')) tagStyle = 'bg-orange-100 text-orange-800';
                        else if (tag === '교육') tagStyle = 'bg-stone-200 text-stone-800';
                        else if (tag === '휴가') tagStyle = 'bg-rose-100 text-rose-800';
                        else if (tag.startsWith('휴가:')) tagStyle = 'bg-stone-100 text-stone-700';

                        tagsBox.innerHTML += `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold ${tagStyle} mr-1 mb-0.5">${tag} <button type="button" onclick="removeTag('${dateKey}', ${idx})" class="ml-1 opacity-60">×</button></span>`;
                    });
                }
            }
        }

        function toggleTodo(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.map(i => i.id === id ? {...i, done: !i.done} : i);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function allowDrop(e) { e.preventDefault(); }
        function dropTodo(e, targetDateKey) {
            e.preventDefault();
            const { dateKey: srcDateKey, id } = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (!data[srcDateKey]?.todos) return;
            const idx = data[srcDateKey].todos.findIndex(i => i.id === id);
            if (idx === -1) return;
            const [moved] = data[srcDateKey].todos.splice(idx, 1);
            if (!data[targetDateKey]) data[targetDateKey] = { todos: [], tags: [], memo: '' };
            if (!data[targetDateKey].todos) data[targetDateKey].todos = [];
            data[targetDateKey].todos.push(moved);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            renderView();
        }

        function deleteTodoItem(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.filter(i => i.id !== id);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function changeTodoType(type) {
            if (!activeTodoTarget) return;
            const { dateKey, id } = activeTodoTarget;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.map(i => i.id === id ? {...i, type: type} : i);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        function copySingleTodoAction() {
            if (!activeTodoTextForCopy) return;
            navigator.clipboard.writeText(activeTodoTextForCopy).then(() => {
                alert(`"${activeTodoTextForCopy}" 내용이 복사되었습니다!`);
            }).catch(err => {
                console.error('복사 실패:', err);
            });
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        function openDateContextMenu(e, dateKey) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('todo-context-menu').classList.add('hidden');
            
            activeDateMenuKey = dateKey;
            const m = document.getElementById('date-context-menu');
            m.style.top = `${e.clientY}px`; m.style.left = `${e.clientX}px`;
            m.classList.remove('hidden');
        }

        function copyDateContent() {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            copiedDateData = data[activeDateMenuKey] ? JSON.parse(JSON.stringify(data[activeDateMenuKey])) : null;
            alert('날짜 전체 내용 복사 완료!');
            document.getElementById('date-context-menu').classList.add('hidden');
        }

        function pasteDateContent() {
            if (!activeDateMenuKey || !copiedDateData) return alert('복사된 내용이 없습니다.');
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            data[activeDateMenuKey] = JSON.parse(JSON.stringify(copiedDateData));
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            renderView();
            document.getElementById('date-context-menu').classList.add('hidden');
        }

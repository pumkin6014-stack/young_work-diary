<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDM · 업무 다이어리</title>
    <!-- 브라우저 탭 아이콘 설정 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        
        .notebook-zone {
            background-color: #ffffff;
            background-image: linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 100% 30px;
        }
        
        .notebook-textarea {
            font-size: 13px !important;
            line-height: 30px !important;
            padding-top: 0px !important;
            padding-bottom: 0px !important;
            background-image: none !important;
        }

        #drawing-canvas { pointer-events: none; }
        #drawing-canvas.pen-active { pointer-events: auto; }
        
        .todo-item { cursor: grab; }
        .todo-item:active { cursor: grabbing; }
        .todo-item.dragging { opacity: 0.4; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col p-2 sm:p-4">

    <!-- 전체 화면 꽉 채우는 레이아웃 컨테이너 -->
    <div class="flex-1 flex bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
        
        <!-- 좌측 사이드 네비게이션 바 -->
        <aside class="w-16 sm:w-20 bg-slate-900 text-white flex flex-col items-center py-5 justify-between shrink-0 select-none">
            <div class="flex flex-col items-center space-y-6">
                <div class="text-[10px] font-black tracking-widest text-slate-400 opacity-0">SDM</div>
                <div class="space-y-3 w-full px-2">
                    <button onclick="switchView('monthly')" id="tab-monthly" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center bg-indigo-600 text-white shadow-sm">
                        <span class="text-xs font-bold">M</span>
                        <span class="text-[9px] mt-0.5">월간</span>
                    </button>
                    <button onclick="switchView('weekly')" id="tab-weekly" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all">
                        <span class="text-xs font-bold">W</span>
                        <span class="text-[9px] mt-0.5">주간</span>
                    </button>
                    <button onclick="switchView('daily')" id="tab-daily" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all">
                        <span class="text-xs font-bold">D</span>
                        <span class="text-[9px] mt-0.5">일간</span>
                    </button>
                    <button onclick="switchView('minutes')" id="tab-minutes" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all">
                        <span class="text-xs font-bold">N</span>
                        <span class="text-[9px] mt-0.5">회의록</span>
                    </button>
                </div>
            </div>
            <div class="text-[9px] text-slate-500 font-mono text-center px-1">
                SDM<br>PLANNER
            </div>
        </aside>

        <!-- 우측 메인 작업 영역 -->
        <div class="flex-1 flex flex-col overflow-hidden bg-slate-50/40">
            
            <!-- 상단 헤더 영역 -->
            <header class="bg-white border-b border-slate-100 px-6 py-4 flex flex-wrap justify-between items-center gap-4 shrink-0">
                <div class="flex items-center gap-3">
                    <h1 id="view-title" class="text-lg font-bold text-slate-900 tracking-tight">월간 다이어리</h1>
                    <!-- 검색 기능 -->
                    <div class="relative">
                        <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="전체 기간 내용 검색..." class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 pl-8 focus:outline-none focus:ring-1 focus:ring-indigo-500 w-40 sm:w-56">
                        <span class="absolute left-2.5 top-2 text-slate-400 text-xs">🔍</span>
                    </div>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <div id="date-navigator" class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                        <span id="current-date-title" class="text-sm font-bold text-slate-700">2026년 11월</span>
                        <div class="flex gap-1">
                            <button onclick="changeDate(-1)" class="w-6 h-6 flex items-center justify-center rounded-md border border-slate-200 bg-white hover:bg-slate-100 text-xs font-bold">‹</button>
                            <button onclick="changeDate(1)" class="w-6 h-6 flex items-center justify-center rounded-md border border-slate-200 bg-white hover:bg-slate-100 text-xs font-bold">›</button>
                        </div>
                    </div>
                    <button onclick="goToToday()" class="px-3 py-1.5 text-xs font-semibold bg-white border border-slate-200 rounded-xl hover:bg-slate-50 shadow-2xs">오늘</button>
                    <button onclick="window.print()" class="px-3 py-1.5 text-xs font-semibold bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hidden md:block">인쇄 / PDF</button>
                </div>
            </header>

            <!-- 펜 및 툴바 영역 -->
            <div class="bg-white border-b border-slate-100 px-6 py-2 flex flex-wrap items-center gap-3 text-xs shrink-0">
                <div class="flex items-center gap-1.5">
                    <button onclick="setMode('keyboard')" id="btn-keyboard" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium shadow-2xs">접기 -</button>
                    <button onclick="setMode('pen')" id="btn-pen-mode" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200">선택 펜</button>
                </div>

                <div id="pen-tools" class="hidden flex items-center gap-2 border-l pl-3 border-slate-200">
                    <div class="flex items-center gap-1">
                        <button onclick="setTool('pen')" id="btn-pen" class="px-2 py-0.5 rounded bg-indigo-600 text-white text-[11px]">볼펜</button>
                        <button onclick="setTool('highlighter')" id="btn-highlighter" class="px-2 py-0.5 rounded bg-white border text-slate-600 text-[11px]">형광펜</button>
                        <button onclick="setTool('eraser')" id="btn-eraser" class="px-2 py-0.5 rounded bg-white border text-slate-600 text-[11px]">지우개</button>
                    </div>
                    <input type="color" id="pen-color" value="#4f46e5" class="w-6 h-6 rounded border cursor-pointer">
                    <input type="range" id="pen-size" min="1" max="20" value="3" class="w-16">
                </div>

                <button onclick="clearCanvas()" class="ml-auto text-rose-500 hover:text-rose-700 font-medium">필기 삭제</button>
            </div>

            <!-- 스크롤 가능한 본문 영역 -->
            <div class="flex-1 overflow-y-auto relative p-0" id="view-container"></div>
            <canvas id="drawing-canvas" class="absolute top-0 left-0 w-full h-full z-20 pointer-events-none"></canvas>
        </div>
    </div>

    <!-- 근무 태그 선택 모달팝업 -->
    <div id="tag-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800 text-sm">근무 태그 선택</h3>
                <button onclick="closeTagModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="selectTag('FD')" class="p-2.5 rounded-xl bg-amber-50 text-amber-700 border border-amber-200 font-bold text-xs hover:bg-amber-100">FD</button>
                <button onclick="selectTag('시간외1')" class="p-2.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold text-xs hover:bg-emerald-100">시간외1</button>
                <button onclick="selectTag('시간외1.5')" class="p-2.5 rounded-xl bg-teal-50 text-teal-700 border border-teal-200 font-bold text-xs hover:bg-teal-100">시간외1.5</button>
                <button onclick="selectTag('시간외2')" class="p-2.5 rounded-xl bg-cyan-50 text-cyan-700 border border-cyan-200 font-bold text-xs hover:bg-cyan-100">시간외2</button>
                <button onclick="selectTag('교육')" class="p-2.5 rounded-xl bg-purple-50 text-purple-700 border border-purple-200 font-bold text-xs hover:bg-purple-100">교육</button>
                <button onclick="selectTag('휴가')" class="col-span-2 p-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 font-bold text-xs hover:bg-rose-100">휴가</button>
            </div>
        </div>
    </div>

    <!-- 휴가 태그 선택 모달팝업 -->
    <div id="chef-vacation-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800 text-sm">휴가자 선택</h3>
                <button onclick="closeChefModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="selectChefTag('김대성')" class="p-3 rounded-xl bg-sky-50 text-sky-700 border border-sky-200 font-bold text-xs hover:bg-sky-100 text-left">김대성</button>
                <button onclick="selectChefTag('최정란')" class="p-3 rounded-xl bg-sky-50 text-sky-700 border border-sky-200 font-bold text-xs hover:bg-sky-100 text-left">최정란</button>
                <button onclick="selectChefTag('황부용')" class="p-3 rounded-xl bg-sky-50 text-sky-700 border border-sky-200 font-bold text-xs hover:bg-sky-100 text-left">황부용</button>
            </div>
        </div>
    </div>

    <!-- 날짜 셀 우클릭 컨텍스트 메뉴 -->
    <div id="date-context-menu" class="fixed z-50 hidden bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 w-48 text-xs">
        <div class="px-3 py-1 font-bold text-slate-400 text-[10px] border-b border-slate-100 mb-1">날짜 메뉴</div>
        <button onclick="copyDateContent()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2"><span>📋</span> 날짜 전체 내용 복사</button>
        <button onclick="pasteDateContent()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-indigo-600 font-medium flex items-center gap-2"><span>📌</span> 날짜 전체 붙여넣기</button>
        <div class="border-t border-slate-100 my-1"></div>
        <button onclick="pasteTodoContent()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-emerald-600 font-medium flex items-center gap-2"><span>📌</span> 복사된 할 일만 붙여넣기</button>
    </div>

    <!-- 할 일 항목 우클릭 컨텍스트 메뉴 (개별 할 일 복사 기능 추가) -->
    <div id="todo-context-menu" class="fixed z-50 hidden bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 w-48 text-xs">
        <div class="px-3 py-1 font-bold text-slate-400 text-[10px] border-b border-slate-100 mb-1">할 일 설정 및 복사</div>
        <button onclick="copySingleTodo()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2"><span>📋</span> 이 할 일만 복사</button>
        <button onclick="pasteTodoContent()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-indigo-600 font-medium flex items-center gap-2"><span>📌</span> 여기에 할 일 붙여넣기</button>
        <div class="border-t border-slate-100 my-1"></div>
        <button onclick="copyDateContentFromTodo()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-500 font-medium flex items-center gap-2"><span>📋</span> 날짜 전체 내용 복사</button>
        <div class="border-t border-slate-100 my-1"></div>
        <button onclick="applyContextMenuColor('bg-rose-50 text-rose-700 border-rose-200')" class="w-full text-left px-3 py-1.5 hover:bg-rose-50 text-rose-700 font-medium flex items-center gap-2"><span>🔴</span> 회의 & 교육</button>
        <button onclick="applyContextMenuColor('bg-amber-50 text-amber-700 border-amber-200')" class="w-full text-left px-3 py-1.5 hover:bg-amber-50 text-amber-700 font-medium flex items-center gap-2"><span>🟡</span> 업무 요청</button>
        <button onclick="applyContextMenuColor('bg-emerald-50 text-emerald-700 border-emerald-200')" class="w-full text-left px-3 py-1.5 hover:bg-emerald-50 text-emerald-700 font-medium flex items-center gap-2"><span>🟢</span> 공지</button>
        <button onclick="applyContextMenuColor('bg-white text-slate-700 border-slate-100')" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-600 font-medium flex items-center gap-2"><span>⚪</span> 기본 (배경없음)</button>
        <div class="border-t border-slate-100 my-1"></div>
        <button onclick="contextMenuEdit()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-700 font-medium">✏️ 내용 수정</button>
        <button onclick="contextMenuDelete()" class="w-full text-left px-3 py-1.5 hover:bg-rose-50 text-rose-600 font-medium">🗑️ 항목 삭제</button>
    </div>

    <script>
        let currentView = 'monthly';
        let currentDate = new Date();
        let currentTool = 'pen';
        let isDrawing = false;
        let activeDateKey = null;
        let activeMinuteId = null;
        let searchQuery = '';
        
        let contextTarget = null;
        let copiedDateData = null; // 날짜 전체 복사본
        let copiedTodoItem = null; // 개별 할 일 복사본
        let activeDateMenuKey = null;
        
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.onload = () => {
            resizeCanvas();
            renderView();
            window.addEventListener('click', () => {
                document.getElementById('todo-context-menu').classList.add('hidden');
                document.getElementById('date-context-menu').classList.add('hidden');
            });
        };

        function switchView(view) {
            currentView = view;
            if (view === 'daily') {
                currentDate = new Date();
            }

            ['monthly', 'weekly', 'daily', 'minutes'].forEach(v => {
                const btn = document.getElementById(`tab-${v}`);
                if(btn) {
                    if(v === view) {
                        btn.className = "w-full py-2.5 rounded-lg flex flex-col items-center justify-center bg-indigo-600 text-white shadow-sm";
                    } else {
                        btn.className = "w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all";
                    }
                }
            });
            const titles = { monthly: '월간 다이어리', weekly: '주간 다이어리', daily: '일간 다이어리', minutes: '회의록' };
            document.getElementById('view-title').innerText = titles[view];
            document.title = titles[view] + ' · SDM';
            
            const nav = document.getElementById('date-navigator');
            if(view === 'minutes') nav.style.display = 'none';
            else nav.style.display = 'flex';

            renderView();
        }

        function renderView() {
            if (currentView === 'monthly') renderMonthly();
            else if (currentView === 'weekly') renderWeekly();
            else if (currentView === 'daily') renderDaily();
            else if (currentView === 'minutes') renderMinutes();
            loadTodos();
        }

        // --- 월간 뷰 ---
        function createMonthlyCellHTML(year, month, day, dateKey, isCurrentMonth = true) {
            const opacityClass = isCurrentMonth ? 'bg-white' : 'bg-white/60 opacity-60';
            return `
                <div class="${opacityClass} min-h-[180px] p-2.5 flex flex-col justify-between relative border border-slate-200" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span onclick="goToDaily(${year}, ${month}, ${day})" class="text-xs font-bold text-slate-800 cursor-pointer hover:text-indigo-600 shrink-0">${day}</span>
                            <div class="flex flex-wrap gap-1 items-center justify-end overflow-hidden max-h-[45px]" id="tags-box-${dateKey}"></div>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto space-y-1 mb-1 max-h-[90px] todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                    
                    <div class="space-y-1 z-30">
                        <div class="flex gap-1">
                            <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-[11px] px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-2 py-1 rounded text-[11px] font-bold shrink-0 hover:bg-indigo-700">+</button>
                        </div>
                        <div class="flex items-center justify-between gap-1 pt-0.5">
                            <button onclick="openChefModal('${dateKey}')" class="text-[10px] px-2 py-0.5 rounded bg-sky-50 text-sky-600 hover:bg-sky-100 font-semibold border border-sky-100">+ 휴가</button>
                            <button onclick="openTagModal('${dateKey}')" class="text-[10px] px-2 py-0.5 rounded bg-slate-50 text-slate-500 hover:bg-slate-100 font-semibold border border-slate-200">+ 근무</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('current-date-title').innerText = `${year}년 ${month + 1}월`;

            const firstDayObj = new Date(year, month, 1);
            let firstDayIndex = firstDayObj.getDay();
            firstDayIndex = (firstDayIndex + 6) % 7;

            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            
            let html = `
                <div class="w-full bg-white border-0 overflow-hidden">
                    <div class="grid grid-cols-7 text-center text-xs font-bold text-slate-400 bg-slate-50 py-3 border-b border-slate-200">
                        <div>월요일</div><div>화요일</div><div>수요일</div><div>목요일</div><div>금요일</div><div class="text-blue-500">토요일</div><div class="text-rose-500">일요일</div>
                    </div>
                    <div class="grid grid-cols-7 gap-[1px] bg-slate-200">
            `;

            const prevMonth = month === 0 ? 11 : month - 1;
            const prevYear = month === 0 ? year - 1 : year;
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const day = prevTotalDays - i;
                const dateKey = `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += createMonthlyCellHTML(prevYear, prevMonth, day, dateKey, false);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += createMonthlyCellHTML(year, month, day, dateKey, true);
            }

            const totalCells = firstDayIndex + totalDays;
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            const nextMonth = month === 11 ? 0 : month + 1;
            const nextYear = month === 11 ? year + 1 : year;
            for (let day = 1; day <= remaining; day++) {
                const dateKey = `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += createMonthlyCellHTML(nextYear, nextMonth, day, dateKey, false);
            }

            html += `</div></div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function goToDaily(year, month, day) {
            currentDate = new Date(year, month, day);
            switchView('daily');
        }

        // --- 주간 뷰 ---
        function createWeeklyCellHTML(dayTitle, dateKey, year, month, day) {
            return `
                <div class="p-5 flex flex-col justify-between min-h-[480px] border-r border-b border-slate-200 bg-white" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div>
                        <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-200">
                            <span onclick="goToDaily(${year}, ${month}, ${day})" class="text-sm font-bold text-slate-900 cursor-pointer hover:text-indigo-600 shrink-0">${dayTitle}</span>
                            <div class="flex flex-wrap gap-1 items-center justify-end" id="tags-box-${dateKey}"></div>
                        </div>
                    </div>
                    
                    <div class="flex-1 flex flex-col justify-between space-y-3 my-1">
                        <div>
                            <div class="space-y-1.5 mb-2 max-h-[120px] overflow-y-auto todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                            <div class="space-y-1.5">
                                <div class="flex gap-1">
                                    <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-xs px-3.5 py-2 bg-white border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-3 py-2 rounded text-xs font-bold shrink-0 hover:bg-indigo-700">+</button>
                                </div>
                                <div class="flex items-center justify-between gap-1">
                                    <button onclick="openChefModal('${dateKey}')" class="text-[10px] px-2 py-1 rounded bg-sky-50 text-sky-600 hover:bg-sky-100 font-semibold border border-sky-100">+ 휴가</button>
                                    <button onclick="openTagModal('${dateKey}')" class="text-[10px] px-2 py-1 rounded bg-slate-50 text-slate-500 hover:bg-slate-100 font-semibold border border-slate-200">+ 근무</button>
                                </div>
                            </div>
                        </div>

                        <!-- 노트 줄무늬 메모 구역 -->
                        <div class="flex-1 notebook-zone p-0">
                            <textarea id="memo-${dateKey}" oninput="saveMemo('${dateKey}')" placeholder="" class="w-full h-full min-h-[120px] text-xs p-0 bg-transparent border-0 rounded-none focus:outline-none resize-none notebook-textarea"></textarea>
                        </div>

                        <!-- 회의록 연동 영역 -->
                        <div id="meeting-box-${dateKey}" class="pt-2 border-t border-dashed border-slate-200 hidden"></div>
                    </div>

                    <div class="text-right pt-2.5 border-t border-slate-200 shrink-0">
                        <button onclick="goToDaily(${year}, ${month}, ${day})" class="text-xs text-indigo-600 font-semibold hover:underline">상세 기록 →</button>
                    </div>
                </div>
            `;
        }

        function renderWeekly() {
            const curr = new Date(currentDate);
            let dayOfWeek = curr.getDay();
            let distanceToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            
            const firstday = new Date(curr);
            firstday.setDate(curr.getDate() + distanceToMon);

            const lastday = new Date(firstday);
            lastday.setDate(firstday.getDate() + 6);
            
            document.getElementById('current-date-title').innerText = `${firstday.getMonth()+1}월 ${firstday.getDate()}일 ~ ${lastday.getMonth()+1}월 ${lastday.getDate()}일`;

            const daysName = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
            let topRowHTML = '';
            let bottomRowHTML = '';

            for (let i = 0; i < 7; i++) {
                const d = new Date(firstday);
                d.setDate(firstday.getDate() + i);
                const year = d.getFullYear();
                const month = d.getMonth();
                const day = d.getDate();
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                let titleStr = `${daysName[i]} ${day}`;
                if(i===5) titleStr = `<span class="text-blue-500">토요일</span> ${day}`;
                if(i===6) titleStr = `<span class="text-rose-500">일요일</span> ${day}`;
                
                const cellHTML = createWeeklyCellHTML(titleStr, dateKey, year, month, day);
                if (i < 4) topRowHTML += cellHTML;
                else bottomRowHTML += cellHTML;
            }

            let emptyCardHTML = `
                <div class="min-h-[480px] border-r border-b border-slate-200 bg-white/50"></div>
            `;

            let html = `
                <div class="w-full bg-white border-t border-l border-slate-200">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
                        ${topRowHTML}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
                        ${bottomRowHTML}
                        ${emptyCardHTML}
                    </div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        // --- 일간 뷰 ---
        function renderDaily() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const day = currentDate.getDate();
            const daysName = ['일', '월', '화', '수', '목', '금', '토'];
            const dayName = daysName[currentDate.getDay()];

            document.getElementById('current-date-title').innerText = `${year}년 ${month}월 ${day}일 (${dayName})`;
            const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            let titleColorClass = "text-slate-900";
            if(currentDate.getDay() === 0) titleColorClass = "text-rose-500";
            if(currentDate.getDay() === 6) titleColorClass = "text-blue-500";

            let html = `
                <div class="w-full p-8 space-y-6 bg-white min-h-[600px] flex flex-col" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div class="border-b border-slate-200 pb-4 flex justify-between items-center shrink-0">
                        <div class="flex items-center gap-4">
                            <h2 class="text-xl font-bold ${titleColorClass}">${month}월 ${day}일 ${dayName}요일</h2>
                            <div class="flex flex-wrap gap-1.5" id="tags-box-${dateKey}"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openChefModal('${dateKey}')" class="px-3 py-1.5 rounded bg-sky-50 text-sky-700 font-bold text-xs border border-sky-200 hover:bg-sky-100">+ 휴가 추가</button>
                            <button onclick="openTagModal('${dateKey}')" class="px-3 py-1.5 rounded bg-slate-100 text-indigo-700 font-bold text-xs border border-slate-200 hover:bg-indigo-50">+ 근무 태그 추가</button>
                        </div>
                    </div>

                    <!-- 할 일 체크리스트 영역 -->
                    <div class="space-y-3 shrink-0">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">할 일 체크리스트 (항목을 마우스로 끌어서 순서 변경 가능)</span>
                        </div>
                        <div class="bg-slate-50/70 border border-slate-200 p-4 rounded-xl space-y-2">
                            <div class="space-y-2 mb-3 max-h-[160px] overflow-y-auto todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                            <div class="flex gap-2">
                                <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일을 입력하세요" class="w-full text-sm px-4 py-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-xs font-bold shrink-0 hover:bg-indigo-700">추가</button>
                            </div>
                        </div>
                    </div>

                    <!-- 일일 메모 작성란 -->
                    <div class="flex-1 flex flex-col space-y-2 pt-2">
                        <div class="text-xs font-bold text-slate-500 shrink-0">일일 메모</div>
                        <div class="flex-1 notebook-zone p-0">
                            <textarea id="memo-${dateKey}" oninput="saveMemo('${dateKey}')" placeholder="" class="w-full h-full min-h-[180px] text-sm p-0 bg-transparent border-0 rounded-none focus:outline-none resize-none notebook-textarea"></textarea>
                        </div>
                    </div>

                    <!-- 해당 날짜 회의록 연동 영역 -->
                    <div id="meeting-box-${dateKey}" class="pt-4 border-t border-slate-200 hidden shrink-0"></div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        // --- 회의록 뷰 ---
        function renderMinutes() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            if (minutes.length > 0 && !activeMinuteId) activeMinuteId = minutes[0].id;

            let html = `
                <div class="w-full bg-white grid grid-cols-1 md:grid-cols-12 min-h-[600px]">
                    <div class="md:col-span-4 border-r border-slate-200 p-5 bg-slate-50/50 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">회의록 목록</h3>
                                <button onclick="createMinute()" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-indigo-700">+ 회의 기록</button>
                            </div>
                            <div class="space-y-2 overflow-y-auto max-h-[500px]" id="minutes-list-box">
                                ${minutes.length === 0 ? '<p class="text-xs text-slate-400 py-6 text-center">저장된 회의록이 없습니다.</p>' : ''}
                                ${minutes.map(m => `
                                    <div onclick="selectMinute(${m.id})" class="p-3.5 rounded-lg border cursor-pointer transition-all ${activeMinuteId === m.id ? 'bg-indigo-50 border-indigo-200 shadow-2xs' : 'bg-white border-slate-200 hover:bg-slate-50'}">
                                        <div class="text-xs font-bold text-slate-800 truncate">${m.title || '제목 없음'}</div>
                                        <div class="text-[10px] text-slate-400 mt-1">${m.date || ''} · 참석자: ${m.attendees || '미지정'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="text-[10px] text-slate-400 text-center pt-3 border-t border-slate-200">
                            기기에 안전하게 저장됨
                        </div>
                    </div>

                    <div class="md:col-span-8 p-8 bg-white flex flex-col justify-between" id="minute-editor-box">
                        ${renderMinuteEditor(minutes.find(m => m.id === activeMinuteId))}
                    </div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        function renderMinuteEditor(minute) {
            if (!minute) return `<div class="flex flex-col items-center justify-center h-full text-slate-400 py-20 text-xs">좌측에서 회의록을 선택하거나 새로 만들어주세요.</div>`;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                        <h3 class="font-bold text-slate-800 text-sm">회의록 상세 작성</h3>
                        <button onclick="deleteMinute(${minute.id})" class="text-xs text-rose-500 hover:bg-rose-50 px-2.5 py-1 rounded font-semibold">삭제</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1">회의 제목</label>
                            <input type="text" id="m-title" value="${minute.title || ''}" oninput="updateMinute(${minute.id})" placeholder="회의 제목을 입력하세요" class="w-full text-xs px-3.5 py-2.5 bg-white border border-slate-200 rounded-none focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1">회의 일시</label>
                            <input type="date" id="m-date" value="${minute.date || ''}" oninput="updateMinute(${minute.id})" class="w-full text-xs px-3.5 py-2.5 bg-white border border-slate-200 rounded-none focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">참석자</label>
                        <input type="text" id="m-attendees" value="${minute.attendees || ''}" oninput="updateMinute(${minute.id})" placeholder="참석자 이름을 입력하세요 (예: 김철수, 이영희)" class="w-full text-xs px-3.5 py-2.5 bg-white border border-slate-200 rounded-none focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">회의 안건 / 주요 내용</label>
                        <textarea id="m-content" oninput="updateMinute(${minute.id})" placeholder="회의에서 논의된 주요 안건과 내용을 기록하세요..." class="w-full h-32 text-xs p-3.5 bg-white border border-slate-200 rounded-none focus:outline-none focus:ring-1 focus:ring-indigo-500 resize-none">${minute.content || ''}</textarea>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">실행 과제 및 결정 사항 (Action Items)</label>
                        <textarea id="m-actions" oninput="updateMinute(${minute.id})" placeholder="결정된 사항과 향후 실행할 과제를 적어주세요..." class="w-full h-24 text-xs p-3.5 bg-white border border-slate-200 rounded-none focus:outline-none focus:ring-1 focus:ring-indigo-500 resize-none">${minute.actions || ''}</textarea>
                    </div>
                </div>
            `;
        }

        function createMinute() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const newM = { id: Date.now(), title: '새로운 회의록', date: new Date().toISOString().split('T')[0], attendees: '', content: '', actions: '' };
            minutes.unshift(newM);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = newM.id;
            renderMinutes();
        }

        function selectMinute(id) { activeMinuteId = id; renderMinutes(); }
        function updateMinute(id) {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const target = minutes.find(m => m.id === id);
            if (!target) return;
            target.title = document.getElementById('m-title').value;
            target.date = document.getElementById('m-date').value;
            target.attendees = document.getElementById('m-attendees').value;
            target.content = document.getElementById('m-content').value;
            target.actions = document.getElementById('m-actions').value;
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            renderView();
        }
        function deleteMinute(id) {
            if(!confirm('이 회의록을 삭제하시겠습니까?')) return;
            let minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            minutes = minutes.filter(m => m.id !== id);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = minutes.length > 0 ? minutes[0].id : null;
            renderMinutes();
        }

        // 공통 조작 함수
        function changeDate(dir) {
            if (currentView === 'monthly') currentDate.setMonth(currentDate.getMonth() + dir);
            else if (currentView === 'weekly') currentDate.setDate(currentDate.getDate() + (dir * 7));
            else currentDate.setDate(currentDate.getDate() + dir);
            renderView();
        }

        function goToToday() { currentDate = new Date(); renderView(); }
        function handleEnter(e, dateKey) { if (e.key === 'Enter') addTodoItem(dateKey); }
        
        function handleSearch(query) {
            searchQuery = query.trim().toLowerCase();
            loadTodos();
        }
        
        function openTagModal(dateKey) { activeDateKey = dateKey; document.getElementById('tag-modal').classList.remove('hidden'); }
        function closeTagModal() { document.getElementById('tag-modal').classList.add('hidden'); activeDateKey = null; }

        function selectTag(tagName) {
            if (!activeDateKey) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[activeDateKey]) data[activeDateKey] = { todos: [], tags: [], memo: '' };
            if(!data[activeDateKey].tags) data[activeDateKey].tags = [];
            data[activeDateKey].tags.push(tagName);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            closeTagModal();
            loadTodos();
        }

        function openChefModal(dateKey) { activeDateKey = dateKey; document.getElementById('chef-vacation-modal').classList.remove('hidden'); }
        function closeChefModal() { document.getElementById('chef-vacation-modal').classList.add('hidden'); activeDateKey = null; }

        function selectChefTag(name) {
            if (!activeDateKey) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[activeDateKey]) data[activeDateKey] = { todos: [], tags: [], memo: '' };
            if(!data[activeDateKey].tags) data[activeDateKey].tags = [];
            data[activeDateKey].tags.push(`휴가: ${name}`);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            closeChefModal();
            loadTodos();
        }

        function removeTag(dateKey, index) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].tags) {
                data[dateKey].tags.splice(index, 1);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                loadTodos();
            }
        }

        function addTodoItem(dateKey) {
            const inputField = document.getElementById(`input-${dateKey}`);
            if (!inputField) return;
            const text = inputField.value.trim();
            if(!text) return;

            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            if(!data[dateKey].todos) data[dateKey].todos = [];

            data[dateKey].todos.push({ id: Date.now(), text, done: false, style: 'bg-white text-slate-700 border-slate-100' });
            localStorage.setItem('sdm_data', JSON.stringify(data));
            inputField.value = '';
            loadTodos();
        }

        function saveMemo(dateKey) {
            const memoField = document.getElementById(`memo-${dateKey}`);
            if (!memoField) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            data[dateKey].memo = memoField.value;
            localStorage.setItem('sdm_data', JSON.stringify(data));
        }

        function loadTodos() {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            
            for (const dateKey in data) {
                const box = document.getElementById(`todo-box-${dateKey}`);
                if (box) {
                    box.innerHTML = '';
                    const todos = data[dateKey].todos || [];

                    todos.forEach((item, index) => {
                        const isMatched = !searchQuery || item.text.toLowerCase().includes(searchQuery) || (data[dateKey].memo && data[dateKey].memo.toLowerCase().includes(searchQuery)) || (data[dateKey].tags && data[dateKey].tags.some(t => t.toLowerCase().includes(searchQuery)));
                        
                        const itemDiv = document.createElement('div');
                        const customStyle = item.style || 'bg-white text-slate-700 border-slate-100';
                        itemDiv.className = `flex items-center justify-between text-[11px] px-2 py-1 rounded border transition-all todo-item ${customStyle} ${searchQuery && !isMatched ? 'opacity-20' : ''}`;
                        itemDiv.draggable = true;
                        itemDiv.dataset.id = item.id;
                        itemDiv.dataset.dateKey = dateKey;
                        itemDiv.dataset.index = index;

                        itemDiv.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('text/plain', JSON.stringify({ dateKey, id: item.id, index }));
                            itemDiv.classList.add('dragging');
                        });
                        itemDiv.addEventListener('dragend', () => {
                            itemDiv.classList.remove('dragging');
                        });

                        itemDiv.addEventListener('contextmenu', (e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            openTodoContextMenu(e, dateKey, item.id);
                        });

                        itemDiv.innerHTML = `
                            <span class="truncate flex-1 cursor-pointer ${item.done ? 'line-through opacity-40' : 'font-medium'}" onclick="toggleTodo('${dateKey}', ${item.id})" title="클릭하여 완료/미완">${item.text}</span>
                            <span class="text-[9px] opacity-40 ml-1 select-none">⠿</span>
                        `;
                        box.appendChild(itemDiv);
                    });
                }

                const memoField = document.getElementById(`memo-${dateKey}`);
                if (memoField && document.activeElement !== memoField) {
                    memoField.value = data[dateKey].memo || '';
                }

                const tagsBox = document.getElementById(`tags-box-${dateKey}`);
                if (tagsBox) {
                    tagsBox.innerHTML = '';
                    const tags = data[dateKey].tags || [];
                    tags.forEach((tag, idx) => {
                        const tagSpan = document.createElement('span');
                        let tagStyle = "inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-50 text-indigo-700 mr-1 mb-0.5";
                        if (tag.includes('휴가')) {
                            tagStyle = "inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-sky-50 text-sky-700 border border-sky-200 mr-1 mb-0.5";
                        }
                        tagSpan.className = tagStyle;
                        tagSpan.innerHTML = `${tag} <button onclick="removeTag('${dateKey}', ${idx})" class="ml-1 opacity-60 hover:opacity-100">×</button>`;
                        tagsBox.appendChild(tagSpan);
                    });
                }
            }

            const allDateKeys = new Set([...Object.keys(data), ...minutes.map(m => m.date)]);
            allDateKeys.forEach(dateKey => {
                const meetingBox = document.getElementById(`meeting-box-${dateKey}`);
                if (meetingBox) {
                    const matchedMinutes = minutes.filter(m => m.date === dateKey);
                    if (matchedMinutes.length > 0) {
                        meetingBox.classList.remove('hidden');
                        meetingBox.innerHTML = `
                            <div class="text-[11px] font-bold text-indigo-600 mb-1">📋 연동된 회의록 (${matchedMinutes.length}건)</div>
                            ${matchedMinutes.map(m => `
                                <div class="bg-indigo-50/50 border border-indigo-100 p-2.5 rounded-lg text-xs space-y-1 mb-1.5">
                                    <div class="font-bold text-slate-800">${m.title || '제목 없음'}</div>
                                    <div class="text-[10px] text-slate-500">참석자: ${m.attendees || '미지정'}</div>
                                    ${m.content ? `<div class="text-slate-600 truncate">내용: ${m.content}</div>` : ''}
                                    ${m.actions ? `<div class="text-indigo-700 font-medium truncate">실행과제: ${m.actions}</div>` : ''}
                                </div>
                            `).join('')}
                        `;
                    } else {
                        meetingBox.classList.add('hidden');
                        meetingBox.innerHTML = '';
                    }
                }
            });
        }

        // --- 날짜 우클릭 메뉴 ---
        function openDateContextMenu(e, dateKey) {
            e.preventDefault();
            activeDateMenuKey = dateKey;
            const menu = document.getElementById('date-context-menu');
            menu.style.top = `${e.clientY}px`;
            menu.style.left = `${e.clientX}px`;
            menu.classList.remove('hidden');
        }

        // --- 할 일 항목 우클릭 메뉴 ---
        function openTodoContextMenu(e, dateKey, id) {
            contextTarget = { dateKey, id };
            activeDateMenuKey = dateKey;
            const menu = document.getElementById('todo-context-menu');
            menu.style.top = `${e.clientY}px`;
            menu.style.left = `${e.clientX}px`;
            menu.classList.remove('hidden');
        }

        // 개별 할 일 복사
        function copySingleTodo() {
            if (!contextTarget) return;
            const { dateKey, id } = contextTarget;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                const target = data[dateKey].todos.find(t => t.id === id);
                if (target) {
                    copiedTodoItem = JSON.parse(JSON.stringify(target));
                    alert(`"${target.text}" 할 일이 복사되었습니다!`);
                }
            }
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        // 복사된 할 일 붙여넣기
        function pasteTodoContent() {
            if (!activeDateMenuKey || !copiedTodoItem) {
                alert('복사된 할 일이 없습니다.');
                return;
            }
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (!data[activeDateMenuKey]) data[activeDateMenuKey] = { todos: [], tags: [], memo: '' };
            if (!data[activeDateMenuKey].todos) data[activeDateMenuKey].todos = [];

            // 새 아이디 부여하여 추가
            const newTodo = { ...copiedTodoItem, id: Date.now() + Math.random() };
            data[activeDateMenuKey].todos.push(newTodo);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            renderView();
            document.getElementById('date-context-menu').classList.add('hidden');
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        function copyDateContent() {
            if (!activeDateMenuKey) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            copiedDateData = data[activeDateMenuKey] ? JSON.parse(JSON.stringify(data[activeDateMenuKey])) : { todos: [], tags: [], memo: '' };
            alert('날짜 전체 내용이 복사되었습니다!');
            document.getElementById('date-context-menu').classList.add('hidden');
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        function copyDateContentFromTodo() {
            copyDateContent();
        }

        function pasteDateContent() {
            if (!activeDateMenuKey || !copiedDateData) {
                alert('복사된 내용이 없습니다.');
                return;
            }
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            data[activeDateMenuKey] = JSON.parse(JSON.stringify(copiedDateData));
            if (data[activeDateMenuKey].todos) {
                data[activeDateMenuKey].todos = data[activeDateMenuKey].todos.map(t => ({...t, id: Date.now() + Math.random()}));
            }
            localStorage.setItem('sdm_data', JSON.stringify(data));
            renderView();
            document.getElementById('date-context-menu').classList.add('hidden');
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        function allowDrop(e) { e.preventDefault(); }

        function dropTodo(e, targetDateKey) {
            e.preventDefault();
            const rawData = e.dataTransfer.getData('text/plain');
            if (!rawData) return;
            const { dateKey: srcDateKey, id } = JSON.parse(rawData);

            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (!data[srcDateKey] || !data[srcDateKey].todos) return;

            const sourceTodos = data[srcDateKey].todos;
            const itemIndex = sourceTodos.findIndex(i => i.id === id);
            if (itemIndex === -1) return;
            const [movedItem] = sourceTodos.splice(itemIndex, 1);

            if (!data[targetDateKey]) data[targetDateKey] = { todos: [], tags: [], memo: '' };
            if (!data[targetDateKey].todos) data[targetDateKey].todos = [];
            data[targetDateKey].todos.push(movedItem);

            localStorage.setItem('sdm_data', JSON.stringify(data));
            loadTodos();
        }

        function applyContextMenuColor(styleClass) {
            if (!contextTarget) return;
            const { dateKey, id } = contextTarget;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                const target = data[dateKey].todos.find(i => i.id === id);
                if (target) {
                    target.style = styleClass;
                    localStorage.setItem('sdm_data', JSON.stringify(data));
                    loadTodos();
                }
            }
            document.getElementById('todo-context-menu').classList.add('hidden');
            contextTarget = null;
        }

        function contextMenuEdit() {
            if (!contextTarget) return;
            const { dateKey, id } = contextTarget;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                const target = data[dateKey].todos.find(i => i.id === id);
                if (target) {
                    const newText = prompt("할 일 수정:", target.text);
                    if (newText !== null && newText.trim() !== "") {
                        target.text = newText.trim();
                        localStorage.setItem('sdm_data', JSON.stringify(data));
                        loadTodos();
                    }
                }
            }
            document.getElementById('todo-context-menu').classList.add('hidden');
            contextTarget = null;
        }

        function contextMenuDelete() {
            if (!contextTarget) return;
            const { dateKey, id } = contextTarget;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.filter(i => i.id !== id);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                loadTodos();
            }
            document.getElementById('todo-context-menu').classList.add('hidden');
            contextTarget = null;
        }

        function toggleTodo(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.map(i => i.id === id ? {...i, done: !i.done} : i);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                loadTodos();
            }
        }

        function setMode(mode) {
            const penTools = document.getElementById('pen-tools');
            const btnKeyboard = document.getElementById('btn-keyboard');
            const btnPenMode = document.getElementById('btn-pen-mode');

            if (mode === 'keyboard') {
                canvas.classList.remove('pen-active');
                penTools.classList.add('hidden');
                btnKeyboard.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium shadow-2xs";
                btnPenMode.className = "px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200";
            } else {
                canvas.classList.add('pen-active');
                penTools.classList.remove('hidden');
                btnPenMode.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium shadow-2xs";
                btnKeyboard.className = "px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200";
            }
        }

        function setTool(tool) {
            currentTool = tool;
            ['pen', 'highlighter', 'eraser'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(t === tool) btn.className = "px-2 py-0.5 rounded bg-indigo-600 text-white text-[11px]";
                else btn.className = "px-2 py-0.5 rounded bg-white border text-slate-600 text-[11px]";
            });
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'pen' || !canvas.classList.contains('pen-active')) return;
            isDrawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || e.pointerType !== 'pen' || !canvas.classList.contains('pen-active')) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = document.getElementById('pen-size').value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'eraser') {
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.globalCompositeOperation = 'destination-out';
            } else if (currentTool === 'highlighter') {
                ctx.strokeStyle = document.getElementById('pen-color').value;
                ctx.globalAlpha = 0.3;
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = Number(ctx.lineWidth) * 3;
            } else {
                ctx.strokeStyle = document.getElementById('pen-color').value;
                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';
            }

            ctx.lineTo(x, y);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', stopDraw);
        canvas.addEventListener('pointerleave', stopDraw);

        function stopDraw() { 
            isDrawing = false; 
            ctx.closePath(); 
        }

        function clearCanvas() {
            if(confirm('필기 내용을 모두 지우시겠습니까?')) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>

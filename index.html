<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDM · 업무 다이어리</title>
    <!-- 브라우저 탭 아이콘 설정 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; }
        .card-notebook-line {
            background-color: #ffffff;
            background-image: linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 100% 28px;
        }
        #drawing-canvas { pointer-events: none; }
        #drawing-canvas.pen-active { pointer-events: auto; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col p-2 sm:p-4">

    <!-- 전체 화면 꽉 채우는 레이아웃 컨테이너 -->
    <div class="flex-1 flex bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
        
        <!-- 좌측 사이드 네비게이션 바 -->
        <aside class="w-16 sm:w-20 bg-slate-900 text-white flex flex-col items-center py-5 justify-between shrink-0 select-none">
            <div class="flex flex-col items-center space-y-6">
                <div class="text-[10px] font-black tracking-widest text-slate-400">SDM</div>
                <div class="space-y-3 w-full px-2">
                    <button onclick="switchView('monthly')" id="tab-monthly" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all">
                        <span class="text-xs font-bold">M</span>
                        <span class="text-[9px] mt-0.5">월간</span>
                    </button>
                    <button onclick="switchView('weekly')" id="tab-weekly" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center bg-indigo-600 text-white shadow-sm">
                        <span class="text-xs font-bold">W</span>
                        <span class="text-[9px] mt-0.5">주간</span>
                    </button>
                    <button onclick="switchView('daily')" id="tab-daily" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all">
                        <span class="text-xs font-bold">D</span>
                        <span class="text-[9px] mt-0.5">일간</span>
                    </button>
                    <button onclick="switchView('minutes')" id="tab-minutes" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all">
                        <span class="text-xs font-bold">N</span>
                        <span class="text-[9px] mt-0.5">회의록</span>
                    </button>
                </div>
            </div>
            <div class="text-[9px] text-slate-500 font-mono text-center px-1">
                SDM<br>PLANNER
            </div>
        </aside>

        <!-- 우측 메인 작업 영역 -->
        <div class="flex-1 flex flex-col overflow-hidden bg-slate-50/50">
            
            <!-- 상단 헤더 영역 -->
            <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex flex-wrap justify-between items-center gap-4 shrink-0">
                <div>
                    <div class="flex items-center gap-2">
                        <h1 id="view-title" class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">주간 다이어리</h1>
                        <span class="text-[11px] text-slate-400 hidden sm:inline">나의 일정 · 업무 · 기록을 한곳에서</span>
                    </div>
                    <div class="text-[11px] text-indigo-600 font-medium mt-0.5">📌 업무포털 미연결 · 개인 기록은 기기에 저장됩니다</div>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <div id="date-navigator" class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                        <span id="current-date-title" class="text-sm font-bold text-slate-700">11월 8일 ~ 11월 14일</span>
                        <div class="flex gap-1">
                            <button onclick="changeDate(-1)" class="w-6 h-6 flex items-center justify-center rounded-md border border-slate-200 bg-white hover:bg-slate-100 text-xs font-bold">‹</button>
                            <button onclick="changeDate(1)" class="w-6 h-6 flex items-center justify-center rounded-md border border-slate-200 bg-white hover:bg-slate-100 text-xs font-bold">›</button>
                        </div>
                    </div>
                    <button onclick="goToToday()" class="px-3 py-1.5 text-xs font-semibold bg-white border border-slate-200 rounded-xl hover:bg-slate-50 shadow-sm">오늘</button>
                    <button onclick="alert('암호화 백업 기능')" class="px-3 py-1.5 text-xs font-semibold bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hidden md:block">암호화 백업</button>
                    <button onclick="alert('복원 기능')" class="px-3 py-1.5 text-xs font-semibold bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hidden md:block">복원</button>
                    <button onclick="window.print()" class="px-3 py-1.5 text-xs font-semibold bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hidden md:block">인쇄 / PDF</button>
                    <button onclick="alert('포털 연동 대기중')" class="px-3 py-1.5 text-xs font-semibold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-sm">포털 연동 로그인</button>
                </div>
            </header>

            <!-- 펜 및 툴바 영역 -->
            <div class="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center gap-3 text-xs shrink-0">
                <div class="flex items-center gap-1.5">
                    <button onclick="setMode('keyboard')" id="btn-keyboard" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium shadow-sm">접기 -</button>
                    <button onclick="setMode('pen')" id="btn-pen-mode" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200">선택 펜</button>
                </div>

                <div id="pen-tools" class="hidden flex items-center gap-2 border-l pl-3 border-slate-200">
                    <div class="flex items-center gap-1">
                        <button onclick="setTool('pen')" id="btn-pen" class="px-2 py-0.5 rounded bg-indigo-600 text-white text-[11px]">볼펜</button>
                        <button onclick="setTool('highlighter')" id="btn-highlighter" class="px-2 py-0.5 rounded bg-white border text-slate-600 text-[11px]">형광펜</button>
                        <button onclick="setTool('eraser')" id="btn-eraser" class="px-2 py-0.5 rounded bg-white border text-slate-600 text-[11px]">지우개</button>
                    </div>
                    <input type="color" id="pen-color" value="#4f46e5" class="w-6 h-6 rounded border cursor-pointer">
                    <input type="range" id="pen-size" min="1" max="20" value="3" class="w-16">
                </div>

                <button onclick="clearCanvas()" class="ml-auto text-rose-500 hover:text-rose-700 font-medium">필기 삭제</button>
            </div>

            <!-- 스크롤 가능한 본문 영역 -->
            <div class="flex-1 overflow-y-auto relative p-4 sm:p-6" id="view-container"></div>
            <canvas id="drawing-canvas" class="absolute top-0 left-0 w-full h-full z-20 pointer-events-none"></canvas>
        </div>
    </div>

    <!-- 근무 태그 선택 모달팝업 -->
    <div id="tag-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800 text-sm">근무 태그 선택</h3>
                <button onclick="closeTagModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="selectTag('FD')" class="p-2.5 rounded-xl bg-amber-50 text-amber-700 border border-amber-200 font-bold text-xs hover:bg-amber-100">FD</button>
                <button onclick="selectTag('시간외1')" class="p-2.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold text-xs hover:bg-emerald-100">시간외1</button>
                <button onclick="selectTag('시간외1.5')" class="p-2.5 rounded-xl bg-teal-50 text-teal-700 border border-teal-200 font-bold text-xs hover:bg-teal-100">시간외1.5</button>
                <button onclick="selectTag('시간외2')" class="p-2.5 rounded-xl bg-cyan-50 text-cyan-700 border border-cyan-200 font-bold text-xs hover:bg-cyan-100">시간외2</button>
                <button onclick="selectTag('휴가')" class="col-span-2 p-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 font-bold text-xs hover:bg-rose-100">휴가</button>
            </div>
        </div>
    </div>

    <script>
        let currentView = 'weekly';
        let currentDate = new Date(2026, 10, 13);
        let currentTool = 'pen';
        let isDrawing = false;
        let activeDateKey = null;
        let activeMinuteId = null;
        
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.onload = () => {
            resizeCanvas();
            renderView();
        };

        function switchView(view) {
            currentView = view;
            ['monthly', 'weekly', 'daily', 'minutes'].forEach(v => {
                const btn = document.getElementById(`tab-${v}`);
                if(btn) {
                    if(v === view) {
                        btn.className = "w-full py-2.5 rounded-lg flex flex-col items-center justify-center bg-indigo-600 text-white shadow-sm";
                    } else {
                        btn.className = "w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all";
                    }
                }
            });
            const titles = { monthly: '월간다이어리', weekly: '주간 다이어리', daily: '일간 다이어리', minutes: '회의록' };
            document.getElementById('view-title').innerText = titles[view];
            document.title = titles[view] + ' · SDM';
            
            const nav = document.getElementById('date-navigator');
            if(view === 'minutes') nav.style.display = 'none';
            else nav.style.display = 'flex';

            renderView();
        }

        function renderView() {
            if (currentView === 'monthly') renderMonthly();
            else if (currentView === 'weekly') renderWeekly();
            else if (currentView === 'daily') renderDaily();
            else if (currentView === 'minutes') renderMinutes();
            loadTodos();
        }

        // --- 월간 뷰 ---
        function createMonthlyCellHTML(year, month, day, dateKey) {
            return `
                <div class="bg-white min-h-[160px] p-2.5 flex flex-col justify-between relative border border-slate-200 hover:bg-slate-50/50">
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <span onclick="goToDaily(${year}, ${month}, ${day})" class="text-xs font-bold text-slate-800 cursor-pointer hover:text-indigo-600 hover:underline" title="클릭시 일간 다이어리로 이동">${day}</span>
                            <button onclick="openTagModal('${dateKey}')" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold">+ 근무</button>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-2" id="tags-box-${dateKey}"></div>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-1 mb-1 max-h-[80px]" id="todo-box-${dateKey}"></div>
                    <div class="flex gap-1 z-30">
                        <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-[11px] px-2 py-1 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-2 py-1 rounded-md text-[11px] font-bold shrink-0 hover:bg-indigo-700">+</button>
                    </div>
                </div>
            `;
        }

        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('current-date-title').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            
            let html = `
                <div class="max-w-7xl mx-auto w-full bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                    <div class="grid grid-cols-7 bg-slate-50 border-b border-slate-200 text-center text-xs font-semibold text-slate-500 py-2.5">
                        <div class="text-rose-500">일요일</div><div>월요일</div><div>화요일</div><div>수요일</div><div>목요일</div><div>금요일</div><div class="text-blue-500">토요일</div>
                    </div>
                    <div class="grid grid-cols-7 bg-slate-200 gap-[1px]">
            `;

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                html += `<div class="bg-white min-h-[160px] p-2.5 opacity-30 border border-slate-200"><div class="text-xs font-semibold text-slate-400">${prevTotalDays - i}</div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += createMonthlyCellHTML(year, month, day, dateKey);
            }

            const totalCells = firstDayIndex + totalDays;
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= remaining; day++) {
                html += `<div class="bg-white min-h-[160px] p-2.5 opacity-30 border border-slate-200"><div class="text-xs font-semibold text-slate-400">${day}</div></div>`;
            }

            html += `</div></div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function goToDaily(year, month, day) {
            currentDate = new Date(year, month, day);
            switchView('daily');
        }

        // --- 주간 뷰 (박스 없이 노트 줄무늬만 적용) ---
        function createWeeklyCellHTML(dayTitle, dateKey, year, month, day) {
            return `
                <div class="min-h-[440px] p-4 flex flex-col justify-between relative card-notebook-line z-30">
                    <div>
                        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200 bg-white/80 px-2 -mx-2">
                            <span onclick="goToDaily(${year}, ${month}, ${day})" class="text-sm font-bold text-slate-900 cursor-pointer hover:text-indigo-600 hover:underline" title="클릭시 일간 다이어리로 이동">${dayTitle}</span>
                            <div class="flex items-center gap-2">
                                <button onclick="openTagModal('${dateKey}')" class="text-[10px] px-1.5 py-0.5 rounded bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold shadow-2xs">+ 근무</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-2" id="tags-box-${dateKey}"></div>
                    </div>
                    
                    <div class="flex-1 space-y-3 overflow-y-auto my-1">
                        <div>
                            <div class="space-y-1 mb-2 max-h-[130px] overflow-y-auto" id="todo-box-${dateKey}"></div>
                            <div class="flex gap-1">
                                <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                                <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 hover:bg-indigo-700">+</button>
                            </div>
                        </div>

                        <div class="pt-2.5 bg-white/80 px-2 -mx-2">
                            <textarea id="memo-${dateKey}" oninput="saveMemo('${dateKey}')" placeholder="" class="w-full h-36 text-xs p-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white resize-none"></textarea>
                        </div>
                    </div>

                    <div class="text-right pt-2 border-t border-slate-200 bg-white/80 px-2 -mx-2">
                        <button onclick="goToDaily(${year}, ${month}, ${day})" class="text-xs text-indigo-600 font-semibold hover:underline">상세 기록 →</button>
                    </div>
                </div>
            `;
        }

        function renderWeekly() {
            const curr = new Date(currentDate);
            const firstday = new Date(curr.setDate(curr.getDate() - curr.getDay()));
            const lastday = new Date(curr.setDate(curr.getDate() - curr.getDay() + 6));
            
            document.getElementById('current-date-title').innerText = `${firstday.getMonth()+1}월 ${firstday.getDate()}일 ~ ${lastday.getMonth()+1}월 ${lastday.getDate()}일`;

            const daysName = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            let topRowHTML = '';
            let bottomRowHTML = '';

            for (let i = 0; i < 7; i++) {
                const d = new Date(firstday);
                d.setDate(firstday.getDate() + i);
                const year = d.getFullYear();
                const month = d.getMonth();
                const day = d.getDate();
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let titleStr = `${daysName[i]} ${day}`;
                if(i===0) titleStr = `<span class="text-rose-500">${daysName[i]}</span> ${day}`;
                if(i===6) titleStr = `<span class="text-blue-500">${daysName[i]}</span> ${day}`;
                
                const cellHTML = createWeeklyCellHTML(titleStr, dateKey, year, month, day);
                if (i < 4) topRowHTML += cellHTML;
                else bottomRowHTML += cellHTML;
            }

            let html = `
                <div class="max-w-7xl mx-auto w-full space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${topRowHTML}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${bottomRowHTML}
                    </div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        // --- 일간 뷰 ---
        function renderDaily() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const day = currentDate.getDate();
            const daysName = ['일', '월', '화', '수', '목', '금', '토'];
            const dayName = daysName[currentDate.getDay()];

            document.getElementById('current-date-title').innerText = `${year}년 ${month}월 ${day}일 (${dayName})`;
            const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            let titleColorClass = "text-slate-900";
            if(currentDate.getDay() === 0) titleColorClass = "text-rose-500";
            if(currentDate.getDay() === 6) titleColorClass = "text-blue-500";

            let html = `
                <div class="max-w-7xl mx-auto w-full p-6 space-y-6 notebook-line z-30 relative min-h-[600px]">
                    <div class="border-b border-slate-300 pb-4 flex justify-between items-center bg-white/80 px-3 py-2 rounded-lg">
                        <div>
                            <h2 class="text-xl font-bold ${titleColorClass}">${month}월 ${day}일 ${dayName}요일 나의 일정 · 메모</h2>
                        </div>
                        <button onclick="openTagModal('${dateKey}')" class="px-3 py-1.5 rounded-lg bg-white text-indigo-700 font-bold text-xs border border-slate-300 shadow-2xs">+ 근무 태그 추가</button>
                    </div>
                    
                    <div class="flex flex-wrap gap-1.5 pb-2" id="tags-box-${dateKey}"></div>

                    <div class="space-y-2">
                        <textarea id="memo-${dateKey}" oninput="saveMemo('${dateKey}')" placeholder="" class="w-full h-56 text-sm p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white/90 resize-none"></textarea>
                    </div>

                    <div class="space-y-2 pt-4">
                        <div class="text-xs font-bold text-slate-600 mb-2">할 일 체크리스트</div>
                        <div class="space-y-2 mb-4 max-h-[220px] overflow-y-auto" id="todo-box-${dateKey}"></div>
                        <div class="flex gap-2">
                            <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일을 입력하세요" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                            <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shrink-0">추가</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        // --- 회의록 뷰 ---
        function renderMinutes() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            if (minutes.length > 0 && !activeMinuteId) activeMinuteId = minutes[0].id;

            let html = `
                <div class="max-w-7xl mx-auto w-full bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm grid grid-cols-1 md:grid-cols-12 min-h-[600px] z-30 relative">
                    <div class="md:col-span-4 border-r border-slate-200 p-4 bg-slate-50/50 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">회의록 목록</h3>
                                <button onclick="createMinute()" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold hover:bg-indigo-700">+ 회의 기록</button>
                            </div>
                            <div class="space-y-1.5 overflow-y-auto max-h-[500px]" id="minutes-list-box">
                                ${minutes.length === 0 ? '<p class="text-xs text-slate-400 py-6 text-center">저장된 회의록이 없습니다.</p>' : ''}
                                ${minutes.map(m => `
                                    <div onclick="selectMinute(${m.id})" class="p-3 rounded-xl border cursor-pointer transition-all ${activeMinuteId === m.id ? 'bg-indigo-50 border-indigo-200 shadow-sm' : 'bg-white border-slate-200 hover:bg-slate-50'}">
                                        <div class="text-xs font-bold text-slate-800 truncate">${m.title || '제목 없음'}</div>
                                        <div class="text-[10px] text-slate-400 mt-0.5">${m.date || ''} · 참석자: ${m.attendees || '미지정'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="text-[10px] text-slate-400 text-center pt-3 border-t border-slate-200">
                            기기에 안전하게 저장됨
                        </div>
                    </div>

                    <div class="md:col-span-8 p-6 bg-white flex flex-col justify-between" id="minute-editor-box">
                        ${renderMinuteEditor(minutes.find(m => m.id === activeMinuteId))}
                    </div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        function renderMinuteEditor(minute) {
            if (!minute) return `<div class="flex flex-col items-center justify-center h-full text-slate-400 py-20 text-xs">좌측에서 회의록을 선택하거나 새로 만들어주세요.</div>`;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h3 class="font-bold text-slate-800 text-sm">회의록 상세 작성</h3>
                        <button onclick="deleteMinute(${minute.id})" class="text-xs text-rose-500 hover:bg-rose-50 px-2 py-1 rounded font-semibold">삭제</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">회의 제목</label>
                            <input type="text" id="m-title" value="${minute.title || ''}" oninput="updateMinute(${minute.id})" placeholder="회의 제목을 입력하세요" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">회의 일시</label>
                            <input type="date" id="m-date" value="${minute.date || ''}" oninput="updateMinute(${minute.id})" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-1">참석자</label>
                        <input type="text" id="m-attendees" value="${minute.attendees || ''}" oninput="updateMinute(${minute.id})" placeholder="참석자 이름을 입력하세요 (예: 김철수, 이영희)" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-1">회의 안건 / 주요 내용</label>
                        <textarea id="m-content" oninput="updateMinute(${minute.id})" placeholder="회의에서 논의된 주요 안건과 내용을 기록하세요..." class="w-full h-32 text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-slate-50 resize-none">${minute.content || ''}</textarea>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-1">실행 과제 및 결정 사항 (Action Items)</label>
                        <textarea id="m-actions" oninput="updateMinute(${minute.id})" placeholder="결정된 사항과 향후 실행할 과제를 적어주세요..." class="w-full h-24 text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-slate-50 resize-none">${minute.actions || ''}</textarea>
                    </div>
                </div>
            `;
        }

        function createMinute() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const newM = { id: Date.now(), title: '새로운 회의록', date: new Date().toISOString().split('T')[0], attendees: '', content: '', actions: '' };
            minutes.unshift(newM);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = newM.id;
            renderMinutes();
        }

        function selectMinute(id) { activeMinuteId = id; renderMinutes(); }
        function updateMinute(id) {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const target = minutes.find(m => m.id === id);
            if (!target) return;
            target.title = document.getElementById('m-title').value;
            target.date = document.getElementById('m-date').value;
            target.attendees = document.getElementById('m-attendees').value;
            target.content = document.getElementById('m-content').value;
            target.actions = document.getElementById('m-actions').value;
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
        }
        function deleteMinute(id) {
            if(!confirm('이 회의록을 삭제하시겠습니까?')) return;
            let minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            minutes = minutes.filter(m => m.id !== id);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = minutes.length > 0 ? minutes[0].id : null;
            renderMinutes();
        }

        // 공통 조작 함수
        function changeDate(dir) {
            if (currentView === 'monthly') currentDate.setMonth(currentDate.getMonth() + dir);
            else if (currentView === 'weekly') currentDate.setDate(currentDate.getDate() + (dir * 7));
            else currentDate.setDate(currentDate.getDate() + dir);
            renderView();
        }

        function goToToday() { currentDate = new Date(); renderView(); }
        function handleEnter(e, dateKey) { if (e.key === 'Enter') addTodoItem(dateKey); }
        function openTagModal(dateKey) { activeDateKey = dateKey; document.getElementById('tag-modal').classList.remove('hidden'); }
        function closeTagModal() { document.getElementById('tag-modal').classList.add('hidden'); activeDateKey = null; }

        function selectTag(tagName) {
            if (!activeDateKey) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[activeDateKey]) data[activeDateKey] = { todos: [], tags: [], memo: '' };
            if(!data[activeDateKey].tags) data[activeDateKey].tags = [];
            data[activeDateKey].tags.push(tagName);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            closeTagModal();
            loadTodos();
        }

        function removeTag(dateKey, index) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].tags) {
                data[dateKey].tags.splice(index, 1);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                loadTodos();
            }
        }

        function addTodoItem(dateKey) {
            const inputField = document.getElementById(`input-${dateKey}`);
            if (!inputField) return;
            const text = inputField.value.trim();
            if(!text) return;

            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            if(!data[dateKey].todos) data[dateKey].todos = [];

            data[dateKey].todos.push({ id: Date.now(), text, done: false });
            localStorage.setItem('sdm_data', JSON.stringify(data));
            inputField.value = '';
            loadTodos();
        }

        function saveMemo(dateKey) {
            const memoField = document.getElementById(`memo-${dateKey}`);
            if (!memoField) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            data[dateKey].memo = memoField.value;
            localStorage.setItem('sdm_data', JSON.stringify(data));
        }

        function loadTodos() {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            
            for (const dateKey in data) {
                const box = document.getElementById(`todo-box-${dateKey}`);
                if (box) {
                    box.innerHTML = '';
                    const todos = data[dateKey].todos || [];

                    todos.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = "flex items-center justify-between text-[11px] bg-white/90 px-2 py-1 rounded border border-slate-200 group shadow-2xs";
                        itemDiv.innerHTML = `
                            <span class="truncate flex-1 cursor-pointer ${item.done ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}" onclick="toggleTodo('${dateKey}', ${item.id})" ondblclick="editTodoItem('${dateKey}', ${item.id})" title="클릭하여 완료/미완">${item.text}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="editTodoItem('${dateKey}', ${item.id})" class="text-slate-400 hover:text-indigo-600 text-[10px]">수정</button>
                                <button onclick="deleteTodoItem('${dateKey}', ${item.id})" class="text-slate-400 hover:text-rose-500 font-bold text-xs">×</button>
                            </div>
                        `;
                        box.appendChild(itemDiv);
                    });
                }

                const memoField = document.getElementById(`memo-${dateKey}`);
                if (memoField && document.activeElement !== memoField) {
                    memoField.value = data[dateKey].memo || '';
                }

                const tagsBox = document.getElementById(`tags-box-${dateKey}`);
                if (tagsBox) {
                    tagsBox.innerHTML = '';
                    const tags = data[dateKey].tags || [];
                    tags.forEach((tag, idx) => {
                        const tagSpan = document.createElement('span');
                        tagSpan.className = "inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 mr-1 mb-1";
                        tagSpan.innerHTML = `${tag} <button onclick="removeTag('${dateKey}', ${idx})" class="ml-1 text-indigo-400 hover:text-rose-500">×</button>`;
                        tagsBox.appendChild(tagSpan);
                    });
                }
            }
        }

        function toggleTodo(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.map(i => i.id === id ? {...i, done: !i.done} : i);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                loadTodos();
            }
        }

        function editTodoItem(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                const target = data[dateKey].todos.find(i => i.id === id);
                if(!target) return;
                const newText = prompt("할 일 수정:", target.text);
                if(newText !== null && newText.trim() !== "") {
                    target.text = newText.trim();
                    localStorage.setItem('sdm_data', JSON.stringify(data));
                    loadTodos();
                }
            }
        }

        function deleteTodoItem(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.filter(i => i.id !== id);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                loadTodos();
            }
        }

        function setMode(mode) {
            const penTools = document.getElementById('pen-tools');
            const btnKeyboard = document.getElementById('btn-keyboard');
            const btnPenMode = document.getElementById('btn-pen-mode');

            if (mode === 'keyboard') {
                canvas.classList.remove('pen-active');
                penTools.classList.add('hidden');
                btnKeyboard.className = "px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium shadow-sm";
                btnPenMode.className = "px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200";
            } else {
                canvas.classList.add('pen-active');
                penTools.classList.remove('hidden');
                btnPenMode.className = "px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium shadow-sm";
                btnKeyboard.className = "px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200";
            }
        }

        function setTool(tool) {
            currentTool = tool;
            ['pen', 'highlighter', 'eraser'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(t === tool) btn.className = "px-2 py-0.5 rounded bg-indigo-600 text-white text-[11px]";
                else btn.className = "px-2 py-0.5 rounded bg-white border text-slate-600 text-[11px]";
            });
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0]); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
        canvas.addEventListener('touchend', stopDraw);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startDraw(e) {
            if (!canvas.classList.contains('pen-active')) return;
            isDrawing = true;
            ctx.beginPath();
            const pos = getPos(e);
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing || !canvas.classList.contains('pen-active')) return;
            const pos = getPos(e);
            ctx.lineWidth = document.getElementById('pen-size').value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'eraser') {
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.globalCompositeOperation = 'destination-out';
            } else if (currentTool === 'highlighter') {
                ctx.strokeStyle = document.getElementById('pen-color').value;
                ctx.globalAlpha = 0.3;
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = Number(ctx.lineWidth) * 3;
            } else {
                ctx.strokeStyle = document.getElementById('pen-color').value;
                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() { isDrawing = false; ctx.closePath(); }
        function clearCanvas() {
            if(confirm('필기 내용을 모두 지우시겠습니까?')) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>

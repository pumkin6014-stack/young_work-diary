<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간다이어리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        #drawing-canvas { pointer-events: none; }
        #drawing-canvas.pen-active { pointer-events: auto; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-3 sm:p-6">

    <div class="w-full max-w-7xl bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
        <!-- 상단 헤더 및 탭 메뉴 -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-100 gap-4">
            <div>
                <p class="text-xs font-bold tracking-widest text-indigo-600 uppercase mb-1">WORK DIARY</p>
                <h1 id="view-title" class="text-2xl font-bold text-slate-900">주간다이어리</h1>
                <p class="text-xs text-slate-500 mt-0.5">나의 일정 · 업무 · 기록을 한곳에서</p>
            </div>

            <!-- 뷰 전환 탭 (월간 / 주간 / 일간 / 회의록) -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                <button onclick="switchView('monthly')" id="tab-monthly" class="px-3 py-1.5 rounded-lg text-slate-600 text-xs font-semibold hover:bg-slate-200">월간</button>
                <button onclick="switchView('weekly')" id="tab-weekly" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold shadow-sm">주간</button>
                <button onclick="switchView('daily')" id="tab-daily" class="px-3 py-1.5 rounded-lg text-slate-600 text-xs font-semibold hover:bg-slate-200">일간</button>
                <button onclick="switchView('minutes')" id="tab-minutes" class="px-3 py-1.5 rounded-lg text-slate-600 text-xs font-semibold hover:bg-slate-200">회의록</button>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="date-navigator" class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                    <span id="current-date-title" class="text-base font-bold text-slate-700">11월 8일 ~ 11월 14일</span>
                    <div class="flex gap-1">
                        <button onclick="changeDate(-1)" class="w-7 h-7 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold">‹</button>
                        <button onclick="changeDate(1)" class="w-7 h-7 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold">›</button>
                    </div>
                </div>
                <button onclick="goToToday()" class="px-3 py-2 text-xs font-semibold bg-white border border-slate-200 rounded-xl hover:bg-slate-50">오늘</button>
            </div>
        </header>

        <!-- 필기 및 입력 툴바 영역 -->
        <div class="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-600">입력 모드:</span>
                <button onclick="setMode('keyboard')" id="btn-keyboard" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-medium shadow-sm">키보드 입력 (기본)</button>
                <button onclick="setMode('pen')" id="btn-pen-mode" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 text-xs font-medium">✍️ S펜 필기</button>
            </div>
            
            <div id="pen-tools" class="hidden flex items-center gap-3 border-l pl-4 border-slate-200">
                <div class="flex items-center gap-1">
                    <button onclick="setTool('pen')" id="btn-pen" class="px-2.5 py-1 rounded bg-indigo-600 text-white text-[11px]">볼펜</button>
                    <button onclick="setTool('highlighter')" id="btn-highlighter" class="px-2.5 py-1 rounded bg-white border text-slate-600 text-[11px]">형광펜</button>
                    <button onclick="setTool('eraser')" id="btn-eraser" class="px-2.5 py-1 rounded bg-white border text-slate-600 text-[11px]">지우개</button>
                </div>
                <div class="flex items-center gap-2">
                    <input type="color" id="pen-color" value="#4f46e5" class="w-7 h-7 rounded border cursor-pointer">
                    <input type="range" id="pen-size" min="1" max="20" value="3" class="w-20">
                </div>
            </div>

            <button onclick="clearCanvas()" class="ml-auto px-3 py-1.5 rounded-lg bg-rose-50 text-rose-600 text-xs font-medium hover:bg-rose-100">필기 초기화</button>
        </div>

        <!-- 다이어리 본체 영역 -->
        <div class="relative border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
            <div id="view-container" class="min-h-[550px]"></div>
            <canvas id="drawing-canvas" class="absolute top-0 left-0 w-full h-full z-10 pointer-events-none"></canvas>
        </div>
    </div>

    <!-- 근무 태그 선택 모달팝업 -->
    <div id="tag-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800 text-sm">근무 태그 선택</h3>
                <button onclick="closeTagModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="selectTag('FD')" class="p-2.5 rounded-xl bg-amber-50 text-amber-700 border border-amber-200 font-bold text-xs hover:bg-amber-100">FD</button>
                <button onclick="selectTag('시간외1')" class="p-2.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold text-xs hover:bg-emerald-100">시간외1</button>
                <button onclick="selectTag('시간외1.5')" class="p-2.5 rounded-xl bg-teal-50 text-teal-700 border border-teal-200 font-bold text-xs hover:bg-teal-100">시간외1.5</button>
                <button onclick="selectTag('시간외2')" class="p-2.5 rounded-xl bg-cyan-50 text-cyan-700 border border-cyan-200 font-bold text-xs hover:bg-cyan-100">시간외2</button>
                <button onclick="selectTag('휴가')" class="col-span-2 p-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 font-bold text-xs hover:bg-rose-100">휴가</button>
            </div>
        </div>
    </div>

    <script>
        let currentView = 'weekly';
        let currentDate = new Date(2026, 10, 13);
        let currentTool = 'pen';
        let isDrawing = false;
        let activeDateKey = null;
        let activeMinuteId = null;
        
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.onload = () => {
            resizeCanvas();
            renderView();
        };

        function switchView(view) {
            currentView = view;
            ['monthly', 'weekly', 'daily', 'minutes'].forEach(v => {
                const btn = document.getElementById(`tab-${v}`);
                if(btn) {
                    if(v === view) {
                        btn.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold shadow-sm";
                    } else {
                        btn.className = "px-3 py-1.5 rounded-lg text-slate-600 text-xs font-semibold hover:bg-slate-200";
                    }
                }
            });
            const titles = { monthly: '월간다이어리', weekly: '주간다이어리', daily: '일간다이어리', minutes: '회의록' };
            document.getElementById('view-title').innerText = titles[view];
            document.title = titles[view];
            
            const nav = document.getElementById('date-navigator');
            if(view === 'minutes') {
                nav.style.display = 'none';
            } else {
                nav.style.display = 'flex';
            }

            renderView();
        }

        function renderView() {
            if (currentView === 'monthly') renderMonthly();
            else if (currentView === 'weekly') renderWeekly();
            else if (currentView === 'daily') renderDaily();
            else if (currentView === 'minutes') renderMinutes();
            loadTodos();
        }

        // --- 월간 뷰 ---
        function createMonthlyCellHTML(year, month, day, dateKey) {
            return `
                <div class="bg-white min-h-[160px] p-2 flex flex-col justify-between relative hover:bg-slate-50/50">
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <span onclick="goToDaily(${year}, ${month},${day})" class="text-xs font-bold text-slate-700 cursor-pointer hover:text-indigo-600 hover:underline" title="클릭시 일간 다이어리로 이동">${day}</span>
                            <button onclick="openTagModal('${dateKey}')" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold">+ 근무</button>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-2" id="tags-box-${dateKey}"></div>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-1 mb-1 max-h-[80px]" id="todo-box-${dateKey}"></div>
                    <div class="flex gap-1 z-20">
                        <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-[11px] px-2 py-1 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-2 py-1 rounded-md text-[11px] font-bold shrink-0 hover:bg-indigo-700">+</button>
                    </div>
                </div>
            `;
        }

        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('current-date-title').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            
            let html = `
                <div class="calendar-grid bg-slate-50 border-b border-slate-200 text-center text-xs font-semibold text-slate-500 py-2.5">
                    <div class="text-rose-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
                </div>
                <div class="calendar-grid bg-slate-200 gap-[1px]">
            `;

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                html += `<div class="bg-white min-h-[160px] p-2 opacity-30"><div class="text-xs font-semibold text-slate-400">${prevTotalDays - i}</div></div>`; }  for (let day = 1; day <= totalDays; day++) { const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += createMonthlyCellHTML(year, month, day, dateKey);
            }

            const totalCells = firstDayIndex + totalDays;
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= remaining; day++) {
                html += `<div class="bg-white min-h-[160px] p-2 opacity-30"><div class="text-xs font-semibold text-slate-400">${day}</div></div>`;
            }

            html += `</div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function goToDaily(year, month, day) {
            currentDate = new Date(year, month, day);
            switchView('daily');
        }

        // --- 주간 뷰 (제시해주신 배치와 정확히 일치) ---
        function createWeeklyCellHTML(dayTitle, dateKey, year, month, day) {
            return `
                <div class="bg-white min-h-[440px] p-3 flex flex-col justify-between relative hover:bg-slate-50/50">
                    <div>
                        <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-100">
                            <span onclick="goToDaily(${year}, ${month},${day})" class="text-xs font-bold text-slate-900 cursor-pointer hover:text-indigo-600 hover:underline" title="클릭시 일간 다이어리로 이동">${dayTitle}</span>
                            <div class="flex flex-wrap gap-0.5 justify-end" id="tags-box-${dateKey}"></div>
                        </div>
                    </div>
                    
                    <div class="flex-1 space-y-3 overflow-y-auto my-1">
                        <div>
                            <div class="text-[10px] font-bold text-slate-400 mb-1">할 일 체크리스트</div>
                            <div class="space-y-1 mb-2 max-h-[120px] overflow-y-auto" id="todo-box-${dateKey}"></div>
                            <div class="flex gap-1 z-20">
                                <input type="text" id="input-${dateKey}" onkeypress="handleEnter(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-[11px] px-2 py-1 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                                <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDM · 업무 다이어리</title>
    <!-- 브라우저 탭 아이콘 설정 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 파이어베이스 안정적인 CDN 라이브러리 로드 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZriTNXekmMNKrnNQnnuVW2SfUEmA8-_4",
            authDomain: "work-diary-8e37b.firebaseapp.com",
            projectId: "work-diary-8e37b",
            storageBucket: "work-diary-8e37b.appspot.com",
            messagingSenderId: "678422675784",
            appId: "1:678422675784:web:3cdca5bbe4a57bccb2f37d",
            measurementId: "G-SK1J7DBPHY"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        auth.onAuthStateChanged((user) => {
            const loginBtn = document.getElementById('login-btn');
            if (user) {
                if(loginBtn) loginBtn.innerText = `${user.displayName.split(' ')[0]} (로그아웃)`;
                loadUserDataFromCloud(user.uid);
            } else {
                if(loginBtn) loginBtn.innerText = '구글 로그인';
            }
        });

        function handleGoogleLogin() {
            const user = auth.currentUser;
            if (user) {
                auth.signOut().then(() => {
                    alert('로그아웃 되었습니다.');
                    location.reload();
                });
            } else {
                auth.signInWithPopup(provider).then((result) => {
                    alert(`${result.user.displayName.split(' ')[0]}님 환영합니다!`);
                }).catch((error) => {
                    console.error("로그인 실패:", error);
                    alert("로그인에 실패했습니다: " + error.message);
                });
            }
        }

        function saveDataToStorage() {
            const sdmData = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            const sdmMinutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const sdmSummaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
            const user = auth.currentUser;
            if (user) {
                db.collection("users").doc(user.uid).set({
                    sdm_data: sdmData,
                    sdm_minutes: sdmMinutes,
                    sdm_summaries: sdmSummaries,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).catch(err => console.error("동기화 실패:", err));
            }
        }

        function loadUserDataFromCloud(uid) {
            db.collection("users").doc(uid).onSnapshot((docSnap) => {
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.sdm_data) localStorage.setItem('sdm_data', JSON.stringify(data.sdm_data));
                    if (data.sdm_minutes) localStorage.setItem('sdm_minutes', JSON.stringify(data.sdm_minutes));
                    if (data.sdm_summaries) localStorage.setItem('sdm_summaries', JSON.stringify(data.sdm_summaries));
                } else {
                    const initialData = JSON.parse(localStorage.getItem('sdm_data') || '{}');
                    const initialMinutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
                    const initialSummaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
                    db.collection("users").doc(uid).set({ sdm_data: initialData, sdm_minutes: initialMinutes, sdm_summaries: initialSummaries }, { merge: true });
                }
                if (typeof renderView === 'function') renderView();
                if (typeof updateSidebarSummary === 'function') updateSidebarSummary();
            });
        }
    </script>

    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .notebook-zone {
            background-color: #ffffff;
            background-image: linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 100% 30px;
        }
        .notebook-textarea {
            font-size: 13px !important;
            line-height: 30px !important;
            padding-top: 0px !important;
            padding-bottom: 0px !important;
            background-image: none !important;
        }
        .todo-item { cursor: grab; }
        .todo-item:active { cursor: grabbing; }
        .todo-item.dragging { opacity: 0.4; }

        #summary-panel {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col p-2 sm:p-4">

    <div class="flex-1 flex bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
        <!-- 좌측 사이드 네비게이션 바 -->
        <aside class="w-16 sm:w-20 bg-slate-900 text-white flex flex-col items-center py-5 justify-between shrink-0 select-none relative z-40">

                <div class="space-y-3 w-full px-2">
                    <button onclick="switchView('monthly')" id="tab-monthly" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center bg-indigo-600 text-white shadow-sm">

                    <button onclick="switchView('minutes')" id="tab-minutes" class="w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all">
                        <span class="text-xs font-bold">N</span>

                    </button>
                </div>

                <!-- 월별 핵심요약 버튼 -->
                <div class="w-full px-2 mt-4">
                    <button onclick="toggleSummaryPanel()" class="w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold flex flex-col items-center justify-center transition-all border border-slate-700 shadow-2xs" title="연도별 월별 요약">
                        <span>📌</span>

                </div>
            </div>

            <div class="text-[9px] text-slate-500 font-mono text-center px-1">
                SDM<br>PLANNER
            </div>

            <!-- 클릭시 오른쪽으로 확장되는 1~12월 구분 요약 패널 -->
            <div id="summary-panel" class="absolute left-full top-0 h-full w-0 bg-slate-900 border-r border-slate-800 shadow-2xl overflow-hidden flex flex-col z-50 pointer-events-none opacity-0">
                <div class="p-4 w-80 flex flex-col h-full justify-between">
                    <div class="space-y-3 flex-1 flex flex-col overflow-hidden">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2 shrink-0">
                            <h3 id="summary-panel-main-title" class="text-xs font-bold text-indigo-400">2026년 월별 핵심요약</h3>
                            <button onclick="toggleSummaryPanel()" class="text-slate-400 hover:text-white text-xs font-bold px-1.5 py-0.5 rounded">✕</button>

                            </div>
                            <textarea id="month-summary-input" oninput="saveMonthSummary()" placeholder="해당 월의 주요 일정을 입력하세요..." class="w-full flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 resize-none"></textarea>

        <!-- 우측 메인 작업 영역 -->

                        <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="전체 기간 내용 검색..." class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 pl-8 focus:outline-none focus:ring-1 focus:ring-indigo-500 w-40 sm:w-56">

        <div class="px-3 py-1 font-bold text-slate-400 text-[10px] border-b border-slate-100 mb-1">날짜 메뉴</div>
        <button onclick="copyDateContent()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2"><span>📋</span> 날짜 전체 내용 복사</button>
        <button onclick="pasteDateContent()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-indigo-600 font-medium flex items-center gap-2"><span>📌</span> 날짜 전체 붙여넣기</button>
    </div>

    <!-- 개별 할 일 우클릭 컨텍스트 메뉴 -->

        <div class="px-3 py-1 font-bold text-slate-400 text-[10px] border-b border-slate-100 mb-1">하이라이트</div>
        <button onclick="changeTodoType('default')" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-700 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-slate-200 inline-block"></span> 기본</button>
        <button onclick="changeTodoType('meeting')" class="w-full text-left px-3 py-1.5 hover:bg-rose-50 text-rose-700 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-rose-400 inline-block"></span> 회의&교육</button>
        <button onclick="changeTodoType('share')" class="w-full text-left px-3 py-1.5 hover:bg-amber-50 text-amber-700 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> 업무공유</button>
        <button onclick="changeTodoType('notice')" class="w-full text-left px-3 py-1.5 hover:bg-emerald-50 text-emerald-700 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> 공지</button>
        <div class="border-t border-slate-100 my-1"></div>
        <button onclick="copySingleTodoAction()" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2"><span>📋</span> 내용 복사</button>
    </div>

    <script>
        let currentView = 'monthly';
        let currentDate = new Date();
        let activeDateKey = null;
        let activeMinuteId = null;
        let searchQuery = '';
        
        let activeDateMenuKey = null;
        let copiedDateData = null;
        let activeTodoTarget = null;
        let activeTodoTextForCopy = '';
        
        let isSummaryOpen = false;
        let selectedSummaryMonth = new Date().getMonth() + 1; // 기본 현재 월

        window.onload = () => {
            renderView();
            window.addEventListener('click', (e) => {
                document.getElementById('date-context-menu').classList.add('hidden');
                document.getElementById('todo-context-menu').classList.add('hidden');
            });
        };

        function toggleSummaryPanel() {
            isSummaryOpen = !isSummaryOpen;
            const panel = document.getElementById('summary-panel');
            
            // 현재 보고 있는 달로 기본 선택 맞추기
            selectedSummaryMonth = currentDate.getMonth() + 1;
            renderMonthTabs();
            updateSidebarSummary();

            if (isSummaryOpen) {
                panel.style.width = '320px';
                panel.style.opacity = '1';
                panel.classList.remove('pointer-events-none');
            } else {
                panel.style.width = '0px';
                panel.style.opacity = '0';
                panel.classList.add('pointer-events-none');
            }
        }

        function renderMonthTabs() {
            const container = document.getElementById('month-tabs-container');
            if (!container) return;
            container.innerHTML = '';

            for (let m = 1; m <= 12; m++) {
                const isSelected = selectedSummaryMonth === m;
                const btn = document.createElement('button');
                btn.className = `py-1.5 rounded text-[10px] font-bold border transition-all ${
                    isSelected 
                        ? 'bg-indigo-600 text-white border-indigo-500 shadow-2xs' 
                        : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                }`;
                btn.innerText = `${m}월`;
                btn.onclick = () => {
                    selectedSummaryMonth = m;
                    renderMonthTabs();
                    updateSidebarSummary();
                };
                container.appendChild(btn);
            }
        }

        function updateSidebarSummary() {
            const year = currentDate.getFullYear();
            const summaryKey = `${year}-${String(selectedSummaryMonth).padStart(2, '0')}`;
            const summaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
            
            const textarea = document.getElementById('month-summary-input');
            if (textarea && document.activeElement !== textarea) {
                textarea.value = summaries[summaryKey] || '';
            }
            
            const labelEl = document.getElementById('active-month-label');
            if (labelEl) {
                labelEl.innerText = `${year}년 ${selectedSummaryMonth}월 주요 일정`;
            }
        }

        function saveMonthSummary() {
            const year = currentDate.getFullYear();
            const summaryKey = `${year}-${String(selectedSummaryMonth).padStart(2, '0')}`;
            const textarea = document.getElementById('month-summary-input');
            if (!textarea) return;

            const summaries = JSON.parse(localStorage.getItem('sdm_summaries') || '{}');
            summaries[summaryKey] = textarea.value;
            localStorage.setItem('sdm_summaries', JSON.stringify(summaries));
            saveDataToStorage();
        }

        function switchView(view) {
            currentView = view;
            if (view === 'daily') currentDate = new Date();

            ['monthly', 'weekly', 'daily', 'minutes'].forEach(v => {
                const btn = document.getElementById(`tab-${v}`);
                if(btn) {
                    btn.className = (v === view) 
                        ? "w-full py-2.5 rounded-lg flex flex-col items-center justify-center bg-indigo-600 text-white shadow-sm"
                        : "w-full py-2.5 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-all";
                }
            });
            const titles = { monthly: '월간 다이어리', weekly: '주간 다이어리', daily: '일간 다이어리', minutes: '회의록' };
            document.getElementById('view-title').innerText = titles[view];
            document.title = titles[view] + ' · SDM';
            
            const nav = document.getElementById('date-navigator');
            nav.style.display = (view === 'minutes') ? 'none' : 'flex';

            renderView();
        }

        function renderView() {
            if (currentView === 'monthly') renderMonthly();
            else if (currentView === 'weekly') renderWeekly();
            else if (currentView === 'daily') renderDaily();
            else if (currentView === 'minutes') renderMinutes();
            loadTodos();
            
            // 상단 날짜가 바뀔 때 패널이 열려있다면 해당 월로 맞추기
            if (isSummaryOpen) {
                selectedSummaryMonth = currentDate.getMonth() + 1;
                renderMonthTabs();
                updateSidebarSummary();
            }
        }

        function createMonthlyCellHTML(year, month, day, dateKey, isCurrentMonth = true) {
            const opacityClass = isCurrentMonth ? 'bg-white' : 'bg-white/60 opacity-60';
            return `
                <div class="${opacityClass} min-h-[180px] p-2.5 flex flex-col justify-between relative border border-slate-200" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span onclick="goToDaily(${year}, ${month}, ${day})" class="text-xs font-bold text-slate-800 cursor-pointer hover:text-indigo-600 shrink-0">${day}</span>
                            <div class="flex flex-wrap gap-1 items-center justify-end overflow-hidden max-h-[45px]" id="tags-box-${dateKey}"></div>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-1 mb-1 max-h-[90px] todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                    <div class="space-y-1 z-30">
                        <div class="flex gap-1">
                            <input type="text" id="input-${dateKey}" onkeydown="handleKeyDown(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-[11px] px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-3 py-1 rounded text-[11px] font-bold shrink-0 hover:bg-indigo-700">+</button>
                        </div>
                        <div class="flex items-center justify-between gap-1 pt-0.5">
                            <button onclick="openChefModal('${dateKey}')" class="text-[10px] px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold border border-indigo-100">+ 휴가</button>
                            <button onclick="openTagModal('${dateKey}')" class="text-[10px] px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold border border-indigo-100">+ 근무</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('current-date-title').innerText = `${year}년 ${month + 1}월`;

            const firstDayObj = new Date(year, month, 1);
            let firstDayIndex = (firstDayObj.getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            
            let html = `
                <div class="w-full bg-white border-0 overflow-hidden">
                    <div class="grid grid-cols-7 text-center text-xs font-bold text-slate-400 bg-slate-50 py-3 border-b border-slate-200">
                        <div>월요일</div><div>화요일</div><div>수요일</div><div>목요일</div><div>금요일</div><div class="text-blue-500">토요일</div><div class="text-rose-500">일요일</div>
                    </div>
                    <div class="grid grid-cols-7 gap-[1px] bg-slate-200">
            `;

            const prevMonth = month === 0 ? 11 : month - 1;
            const prevYear = month === 0 ? year - 1 : year;
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const day = prevTotalDays - i;
                html += createMonthlyCellHTML(prevYear, prevMonth, day, `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, false);
            }

            for (let day = 1; day <= totalDays; day++) {
                html += createMonthlyCellHTML(year, month, day, `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, true);
            }

            const remaining = (7 - ((firstDayIndex + totalDays) % 7)) % 7;
            const nextMonth = month === 11 ? 0 : month + 1;
            const nextYear = month === 11 ? year + 1 : year;
            for (let day = 1; day <= remaining; day++) {
                html += createMonthlyCellHTML(nextYear, nextMonth, day, `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, false);
            }

            html += `</div></div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function goToDaily(year, month, day) {
            currentDate = new Date(year, month, day);
            switchView('daily');
        }

        function createWeeklyCellHTML(dayTitle, dateKey, year, month, day) {
            return `
                <div class="p-5 flex flex-col justify-between min-h-[480px] border-r border-b border-slate-200 bg-white" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div>
                        <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-200">
                            <span onclick="goToDaily(${year}, ${month}, ${day})" class="text-sm font-bold text-slate-900 cursor-pointer hover:text-indigo-600 shrink-0">${dayTitle}</span>
                            <div class="flex flex-wrap gap-1 items-center justify-end" id="tags-box-${dateKey}"></div>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col justify-between space-y-3 my-1">
                        <div>
                            <div class="space-y-1.5 mb-2 max-h-[120px] overflow-y-auto todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                            <div class="space-y-1.5">
                                <div class="flex gap-1">
                                    <input type="text" id="input-${dateKey}" onkeydown="handleKeyDown(event, '${dateKey}')" placeholder="할 일 입력" class="w-full text-xs px-3.5 py-2 bg-white border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-3 py-2 rounded text-xs font-bold shrink-0 hover:bg-indigo-700">+</button>
                                </div>
                                <div class="flex items-center justify-between gap-1">
                                    <button onclick="openChefModal('${dateKey}')" class="text-[10px] px-2 py-1 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold border border-indigo-100">+ 휴가</button>
                                    <button onclick="openTagModal('${dateKey}')" class="text-[10px] px-2 py-1 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold border border-indigo-100">+ 근무</button>
                                </div>
                            </div>
                        </div>
                        <div class="flex-1 notebook-zone p-0">
                            <textarea id="memo-${dateKey}" oninput="saveMemo('${dateKey}')" class="w-full h-full min-h-[120px] text-xs p-0 bg-transparent border-0 rounded-none focus:outline-none resize-none notebook-textarea"></textarea>
                        </div>
                    </div>
                    <div class="text-right pt-2.5 border-t border-slate-200 shrink-0">
                        <button onclick="goToDaily(${year}, ${month}, ${day})" class="text-xs text-indigo-600 font-semibold hover:underline">상세 기록 →</button>
                    </div>
                </div>
            `;
        }

        function renderWeekly() {
            const curr = new Date(currentDate);
            const distanceToMon = (curr.getDay() === 0 ? -6 : 1 - curr.getDay());
            const firstday = new Date(curr);
            firstday.setDate(curr.getDate() + distanceToMon);
            const lastday = new Date(firstday);
            lastday.setDate(firstday.getDate() + 6);
            
            document.getElementById('current-date-title').innerText = `${firstday.getMonth()+1}월 ${firstday.getDate()}일 ~ ${lastday.getMonth()+1}월 ${lastday.getDate()}일`;

            const daysName = ['월요일', '화요일', '수요일', '목요일', '금요일', '<span class="text-blue-500">토요일</span>', '<span class="text-rose-500">일요일</span>'];
            let topRowHTML = '', bottomRowHTML = '';

            for (let i = 0; i < 7; i++) {
                const d = new Date(firstday);
                d.setDate(firstday.getDate() + i);
                const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                const cell = createWeeklyCellHTML(`${daysName[i]} ${d.getDate()}`, dateKey, d.getFullYear(), d.getMonth(), d.getDate());
                if (i < 4) topRowHTML += cell;
                else bottomRowHTML += cell;
            }

            document.getElementById('view-container').innerHTML = `
                <div class="w-full bg-white border-t border-l border-slate-200">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">${topRowHTML}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">${bottomRowHTML}<div class="min-h-[480px] border-r border-b border-slate-200 bg-white/50"></div></div>
                </div>
            `;
        }

        function renderDaily() {
            const year = currentDate.getFullYear(), month = currentDate.getMonth() + 1, day = currentDate.getDate();
            const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayName = ['일', '월', '화', '수', '목', '금', '토'][currentDate.getDay()];

            document.getElementById('current-date-title').innerText = `${year}년 ${month}월 ${day}일 (${dayName})`;

            document.getElementById('view-container').innerHTML = `
                <div class="w-full p-8 space-y-6 bg-white min-h-[600px] flex flex-col" oncontextmenu="openDateContextMenu(event, '${dateKey}')">
                    <div class="border-b border-slate-200 pb-4 flex justify-between items-center shrink-0">
                        <div class="flex items-center gap-4">
                            <h2 class="text-xl font-bold text-slate-900">${month}월 ${day}일 ${dayName}요일</h2>
                            <div class="flex flex-wrap gap-1.5" id="tags-box-${dateKey}"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openChefModal('${dateKey}')" class="px-3 py-1.5 rounded bg-indigo-50 text-indigo-700 font-bold text-xs border border-indigo-100">+ 휴가 추가</button>
                            <button onclick="openTagModal('${dateKey}')" class="px-3 py-1.5 rounded bg-indigo-50 text-indigo-700 font-bold text-xs border border-indigo-100">+ 근무 태그 추가</button>
                        </div>
                    </div>
                    <div class="space-y-3 shrink-0">
                        <div class="bg-slate-50/70 border border-slate-200 p-4 rounded-xl space-y-2">
                            <div class="space-y-2 mb-3 max-h-[160px] overflow-y-auto todo-dropzone" ondragover="allowDrop(event)" ondrop="dropTodo(event, '${dateKey}')" id="todo-box-${dateKey}"></div>
                            <div class="flex gap-2">
                                <input type="text" id="input-${dateKey}" onkeydown="handleKeyDown(event, '${dateKey}')" placeholder="할 일을 입력하세요" class="w-full text-sm px-4 py-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <button onclick="addTodoItem('${dateKey}')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-xs font-bold shrink-0 hover:bg-indigo-700">추가</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col space-y-2 pt-2">
                        <div class="text-xs font-bold text-slate-500 shrink-0">일일 메모</div>
                        <div class="flex-1 notebook-zone p-0">
                            <textarea id="memo-${dateKey}" oninput="saveMemo('${dateKey}')" class="w-full h-full min-h-[180px] text-sm p-0 bg-transparent border-0 rounded-none focus:outline-none resize-none notebook-textarea"></textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMinutes() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            if (minutes.length > 0 && !activeMinuteId) activeMinuteId = minutes[0].id;

            document.getElementById('view-container').innerHTML = `
                <div class="w-full bg-white grid grid-cols-1 md:grid-cols-12 min-h-[600px]">
                    <div class="md:col-span-4 border-r border-slate-200 p-5 bg-slate-50/50 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xs font-bold text-slate-700 uppercase">회의록 목록</h3>
                                <button onclick="createMinute()" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold">+ 회의 기록</button>
                            </div>
                            <div class="space-y-2 overflow-y-auto max-h-[500px]">
                                ${minutes.length === 0 ? '<p class="text-xs text-slate-400 py-6 text-center">저장된 회의록이 없습니다.</p>' : ''}
                                ${minutes.map(m => `
                                    <div onclick="selectMinute(${m.id})" class="p-3.5 rounded-lg border cursor-pointer transition-all ${activeMinuteId === m.id ? 'bg-indigo-50 border-indigo-200 shadow-2xs' : 'bg-white border-slate-200 hover:bg-slate-50'}">
                                        <div class="text-xs font-bold text-slate-800 truncate">${m.title || '제목 없음'}</div>
                                        <div class="text-[10px] text-slate-400 mt-1">${m.date || ''} · 참석자: ${m.attendees || '미지정'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="md:col-span-8 p-8 bg-white flex flex-col justify-between">
                        ${renderMinuteEditor(minutes.find(m => m.id === activeMinuteId))}
                    </div>
                </div>
            `;
        }

        function renderMinuteEditor(minute) {
            if (!minute) return `<div class="flex items-center justify-center h-full text-slate-400 text-xs">좌측에서 회의록을 선택하거나 새로 만들어주세요.</div>`;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                        <h3 class="font-bold text-slate-800 text-sm">회의록 상세 작성</h3>
                        <button onclick="deleteMinute(${minute.id})" class="text-xs text-rose-500 hover:bg-rose-50 px-2.5 py-1 rounded font-semibold">삭제</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" id="m-title" value="${minute.title || ''}" oninput="updateMinute(${minute.id})" placeholder="회의 제목" class="text-xs px-3.5 py-2.5 border border-slate-200 focus:outline-none">
                        <input type="date" id="m-date" value="${minute.date || ''}" oninput="updateMinute(${minute.id})" class="text-xs px-3.5 py-2.5 border border-slate-200 focus:outline-none">
                    </div>
                    <input type="text" id="m-attendees" value="${minute.attendees || ''}" oninput="updateMinute(${minute.id})" placeholder="참석자 이름" class="w-full text-xs px-3.5 py-2.5 border border-slate-200 focus:outline-none">
                    <textarea id="m-content" oninput="updateMinute(${minute.id})" placeholder="회의 내용..." class="w-full h-32 text-xs p-3.5 border border-slate-200 resize-none focus:outline-none">${minute.content || ''}</textarea>
                    <textarea id="m-actions" oninput="updateMinute(${minute.id})" placeholder="실행 과제..." class="w-full h-24 text-xs p-3.5 border border-slate-200 resize-none focus:outline-none">${minute.actions || ''}</textarea>
                </div>
            `;
        }

        function createMinute() {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const newM = { id: Date.now(), title: '새로운 회의록', date: new Date().toISOString().split('T')[0], attendees: '', content: '', actions: '' };
            minutes.unshift(newM);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = newM.id;
            saveDataToStorage();
            renderMinutes();
        }

        function selectMinute(id) { activeMinuteId = id; renderMinutes(); }
        function updateMinute(id) {
            const minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            const target = minutes.find(m => m.id === id);
            if (!target) return;
            target.title = document.getElementById('m-title').value;
            target.date = document.getElementById('m-date').value;
            target.attendees = document.getElementById('m-attendees').value;
            target.content = document.getElementById('m-content').value;
            target.actions = document.getElementById('m-actions').value;
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            saveDataToStorage();
        }
        function deleteMinute(id) {
            if(!confirm('삭제하시겠습니까?')) return;
            let minutes = JSON.parse(localStorage.getItem('sdm_minutes') || '[]');
            minutes = minutes.filter(m => m.id !== id);
            localStorage.setItem('sdm_minutes', JSON.stringify(minutes));
            activeMinuteId = minutes.length > 0 ? minutes[0].id : null;
            saveDataToStorage();
            renderMinutes();
        }

        function changeDate(dir) {
            if (currentView === 'monthly') currentDate.setMonth(currentDate.getMonth() + dir);
            else if (currentView === 'weekly') currentDate.setDate(currentDate.getDate() + (dir * 7));
            else currentDate.setDate(currentDate.getDate() + dir);
            renderView();
        }
        function goToToday() { currentDate = new Date(); renderView(); }
        
        function handleKeyDown(e, dateKey) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTodoItem(dateKey);
            }
        }
        
        function handleSearch(q) { searchQuery = q.trim().toLowerCase(); loadTodos(); }
        
        function openTagModal(dateKey) { activeDateKey = dateKey; document.getElementById('tag-modal').classList.remove('hidden'); }
        function closeTagModal() { document.getElementById('tag-modal').classList.add('hidden'); activeDateKey = null; }
        function selectTag(tagName) {
            if (!activeDateKey) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[activeDateKey]) data[activeDateKey] = { todos: [], tags: [], memo: '' };
            if(!data[activeDateKey].tags) data[activeDateKey].tags = [];
            data[activeDateKey].tags.push(tagName);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            closeTagModal();
            loadTodos();
        }

        function openChefModal(dateKey) { activeDateKey = dateKey; document.getElementById('chef-vacation-modal').classList.remove('hidden'); }
        function closeChefModal() { document.getElementById('chef-vacation-modal').classList.add('hidden'); activeDateKey = null; }
        function selectChefTag(name) { selectTag(`휴가: ${name}`); closeChefModal(); }

        function removeTag(dateKey, index) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey]?.tags) {
                data[dateKey].tags.splice(index, 1);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                loadTodos();
            }
        }

        function addTodoItem(dateKey) {
            const inputField = document.getElementById(`input-${dateKey}`);
            if (!inputField || !inputField.value.trim()) return;
            
            const text = inputField.value.trim();

            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            if(!data[dateKey].todos) data[dateKey].todos = [];
            data[dateKey].todos.push({ id: Date.now(), text, type: 'default', done: false });
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            
            inputField.value = '';
            updateTodoBoxOnly(dateKey);
            
            setTimeout(() => {
                const targetInput = document.getElementById(`input-${dateKey}`);
                if (targetInput) targetInput.focus();
            }, 10);
        }

        function moveTodoUp(dateKey, index) {
            if (index <= 0) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                const temp = data[dateKey].todos[index];
                data[dateKey].todos[index] = data[dateKey].todos[index - 1];
                data[dateKey].todos[index - 1] = temp;
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function moveTodoDown(dateKey, index) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                if (index >= data[dateKey].todos.length - 1) return;
                const temp = data[dateKey].todos[index];
                data[dateKey].todos[index] = data[dateKey].todos[index + 1];
                data[dateKey].todos[index + 1] = temp;
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function updateTodoBoxOnly(dateKey) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            const box = document.getElementById(`todo-box-${dateKey}`);
            if (box && data[dateKey]) {
                box.innerHTML = '';
                (data[dateKey].todos || []).forEach((item, index) => {
                    let bgClass = 'bg-white text-slate-700 border-slate-100';
                    if (item.type === 'meeting') bgClass = 'bg-rose-100 text-rose-900 border-rose-200 font-semibold';
                    else if (item.type === 'share') bgClass = 'bg-amber-100 text-amber-900 border-amber-200 font-semibold';
                    else if (item.type === 'notice') bgClass = 'bg-emerald-100 text-emerald-900 border-emerald-200 font-semibold';

                    const itemDiv = document.createElement('div');
                    itemDiv.className = `flex items-center justify-between text-[11px] px-2 py-1 rounded border ${bgClass} todo-item`;
                    itemDiv.draggable = true;
                    itemDiv.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', JSON.stringify({ dateKey, id: item.id })));
                    
                    itemDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        document.getElementById('date-context-menu').classList.add('hidden');
                        
                        activeTodoTarget = { dateKey, id: item.id };
                        activeTodoTextForCopy = item.text;
                        
                        const menu = document.getElementById('todo-context-menu');
                        menu.style.top = `${e.clientY}px`;
                        menu.style.left = `${e.clientX}px`;
                        menu.classList.remove('hidden');
                    });

                    itemDiv.innerHTML = `
                        <span class="truncate flex-1 cursor-pointer ${item.done ? 'line-through opacity-40' : ''}" onclick="toggleTodo('${dateKey}', ${item.id})">${item.text}</span>
                        <div class="flex items-center gap-0.5 ml-1 shrink-0">
                            <div class="flex flex-col">
                                <button onclick="moveTodoUp('${dateKey}', ${index})" class="text-[8px] text-slate-400 hover:text-indigo-600 leading-none px-0.5" title="위로">▲</button>
                                <button onclick="moveTodoDown('${dateKey}', ${index})" class="text-[8px] text-slate-400 hover:text-indigo-600 leading-none px-0.5" title="아래로">▼</button>
                            </div>
                            <button onclick="deleteTodoItem('${dateKey}', ${item.id})" class="text-[10px] text-slate-400 hover:text-rose-500 px-1 font-bold ml-0.5" title="삭제">×</button>
                        </div>
                    `;
                    box.appendChild(itemDiv);
                });
            }
        }

        function saveMemo(dateKey) {
            const memoField = document.getElementById(`memo-${dateKey}`);
            if (!memoField) return;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(!data[dateKey]) data[dateKey] = { todos: [], tags: [], memo: '' };
            data[dateKey].memo = memoField.value;
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
        }

        function loadTodos() {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            for (const dateKey in data) {
                updateTodoBoxOnly(dateKey);
                
                const memoField = document.getElementById(`memo-${dateKey}`);
                if (memoField && document.activeElement !== memoField) memoField.value = data[dateKey].memo || '';
                
                const tagsBox = document.getElementById(`tags-box-${dateKey}`);
                if (tagsBox) {
                    tagsBox.innerHTML = '';
                    (data[dateKey].tags || []).forEach((tag, idx) => {
                        let tagStyle = 'bg-indigo-50 text-indigo-700';
                        if (tag === 'FD') tagStyle = 'bg-amber-100 text-amber-800';
                        else if (tag === '당직') tagStyle = 'bg-yellow-100 text-yellow-800';
                        else if (tag.startsWith('시간외')) tagStyle = 'bg-orange-100 text-orange-800';
                        else if (tag === '교육') tagStyle = 'bg-blue-100 text-blue-800';
                        else if (tag === '휴가') tagStyle = 'bg-rose-100 text-rose-800';
                        else if (tag.startsWith('휴가:')) tagStyle = 'bg-slate-100 text-slate-700';

                        tagsBox.innerHTML += `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold ${tagStyle} mr-1 mb-0.5">${tag} <button onclick="removeTag('${dateKey}', ${idx})" class="ml-1 opacity-60">×</button></span>`;
                    });
                }
            }
        }

        function toggleTodo(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.map(i => i.id === id ? {...i, done: !i.done} : i);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function allowDrop(e) { e.preventDefault(); }
        function dropTodo(e, targetDateKey) {
            e.preventDefault();
            const { dateKey: srcDateKey, id } = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (!data[srcDateKey]?.todos) return;
            const idx = data[srcDateKey].todos.findIndex(i => i.id === id);
            if (idx === -1) return;
            const [moved] = data[srcDateKey].todos.splice(idx, 1);
            if (!data[targetDateKey]) data[targetDateKey] = { todos: [], tags: [], memo: '' };
            if (!data[targetDateKey].todos) data[targetDateKey].todos = [];
            data[targetDateKey].todos.push(moved);
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            renderView();
        }

        function deleteTodoItem(dateKey, id) {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if(data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.filter(i => i.id !== id);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
        }

        function changeTodoType(type) {
            if (!activeTodoTarget) return;
            const { dateKey, id } = activeTodoTarget;
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            if (data[dateKey] && data[dateKey].todos) {
                data[dateKey].todos = data[dateKey].todos.map(i => i.id === id ? {...i, type: type} : i);
                localStorage.setItem('sdm_data', JSON.stringify(data));
                saveDataToStorage();
                updateTodoBoxOnly(dateKey);
            }
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        function copySingleTodoAction() {
            if (!activeTodoTextForCopy) return;
            navigator.clipboard.writeText(activeTodoTextForCopy).then(() => {
                alert(`"${activeTodoTextForCopy}" 내용이 복사되었습니다!`);
            }).catch(err => {
                console.error('복사 실패:', err);
            });
            document.getElementById('todo-context-menu').classList.add('hidden');
        }

        function openDateContextMenu(e, dateKey) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('todo-context-menu').classList.add('hidden');
            
            activeDateMenuKey = dateKey;
            const m = document.getElementById('date-context-menu');
            m.style.top = `${e.clientY}px`; m.style.left = `${e.clientX}px`;
            m.classList.remove('hidden');
        }

        function copyDateContent() {
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            copiedDateData = data[activeDateMenuKey] ? JSON.parse(JSON.stringify(data[activeDateMenuKey])) : null;
            alert('날짜 전체 내용 복사 완료!');
            document.getElementById('date-context-menu').classList.add('hidden');
        }

        function pasteDateContent() {
            if (!activeDateMenuKey || !copiedDateData) return alert('복사된 내용이 없습니다.');
            const data = JSON.parse(localStorage.getItem('sdm_data') || '{}');
            data[activeDateMenuKey] = JSON.parse(JSON.stringify(copiedDateData));
            localStorage.setItem('sdm_data', JSON.stringify(data));
            saveDataToStorage();
            renderView();
            document.getElementById('date-context-menu').classList.add('hidden');
        }
    </script>
</body>
</html>

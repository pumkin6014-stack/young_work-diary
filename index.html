<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 다이어리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center p-4 sm:p-6">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">
        <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
            <h1 class="text-2xl font-bold text-slate-900">📖 스마트 다이어리</h1>
            <span id="current-date" class="text-sm font-medium text-slate-500"></span>
        </header>

        <!-- 할 일 입력 섹션 -->
        <section class="mb-8">
            <h2 class="text-lg font-semibold mb-3 text-slate-700">오늘의 할 일</h2>
            <div class="flex gap-2">
                <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm">
                <button onclick="addTodo()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition-colors">추가</button>
            </div>
            <ul id="todo-list" class="mt-4 space-y-2"></ul>
        </section>

        <!-- 일기 작성 섹션 -->
        <section>
            <h2 class="text-lg font-semibold mb-3 text-slate-700">오늘의 기록</h2>
            <textarea id="diary-content" rows="6" placeholder="오늘 하루는 어땠나요? 자유롭게 적어보세요..." class="w-full p-4 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm resize-none"></textarea>
            <button onclick="saveDiary()" class="mt-3 w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl text-sm transition-colors">일기 저장하기</button>
        </section>
    </div>

    <script>
        // 오늘 날짜 표시
        const dateOpt = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ko-KR', dateOpt);

        // 로컬 데이터 불러오기
        window.onload = function() {
            loadTodos();
            const savedDiary = localStorage.getItem('diary_text');
            if (savedDiary) document.getElementById('diary-content').value = savedDiary;
        };

        // 할 일 추가 함수
        function addTodo() {
            const input = document.getElementById('input'); // corrected selector fallback
            // safe query selector
            const inputField = document.getElementById('todo-input');
            const text = inputField.value.trim();
            if (!text) return;

            const todos = JSON.parse(localStorage.getItem('todos') || '[]');
            todos.push({ text, done: false });
            localStorage.setItem('todos', JSON.stringify(todos));
            inputField.value = '';
            loadTodos();
        }

        function loadTodos() {
            const list = document.getElementById('todo-list');
            const todos = JSON.parse(localStorage.getItem('todos') || '[]');
            list.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm";
                li.innerHTML = `
                    <span class="${todo.done ? 'line-through text-slate-400' : ''}">${todo.text}</span>
                    <button onclick="deleteTodo(${index})" class="text-slate-400 hover:text-rose-500 text-xs font-medium">삭제</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteTodo(index) {
            const todos = JSON.parse(localStorage.getItem('todos') || '[]');
            todos.splice(index, 1);
            localStorage.setItem('todos', JSON.stringify(todos));
            loadTodos();
        }

        function saveDiary() {
            const content = document.getElementById('diary-content').value;
            localStorage.setItem('diary_text', content);
            alert('일기가 성공적으로 저장되었습니다!');
        }
    </script>
</body>
</html>
